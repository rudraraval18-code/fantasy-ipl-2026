<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050510">
<title>Fantasy IPL 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏏</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#050510;color:#e0e0e0;min-height:100vh}
.w{max-width:640px;margin:0 auto;padding:14px 16px 40px}
.card{background:#0a0a1a;border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid #1a1a3e}
.hdr{background:linear-gradient(135deg,#0d0d25,#0a0a1a);border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid #1a1a3e;position:relative;overflow:hidden}
.tab{display:flex;gap:4px;margin-bottom:14px;position:sticky;top:0;z-index:10;background:#050510;padding:6px 0}
.tab div{flex:1;padding:10px 0;border-radius:10px;cursor:pointer;font-weight:700;font-size:11px;text-align:center;background:#0a0a1a;color:#555;border:1px solid #1a1a3e;transition:all .2s}
.tab div.on{background:#00F0FF11;color:#00F0FF;border-color:#00F0FF55;box-shadow:0 0 12px #00F0FF15}
.bar{height:5px;background:#111;border-radius:5px;margin-top:10px;overflow:hidden}
.bar div{height:100%;border-radius:5px;transition:width .6s ease}
.ri{animation:ri .4s ease both}
@keyframes ri{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes glow{0%,100%{text-shadow:0 0 10px var(--gc),0 0 20px var(--gc)}50%{text-shadow:0 0 20px var(--gc),0 0 40px var(--gc),0 0 60px var(--gc)}}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#00F0FF;animation:pulse 1.5s infinite;margin-right:4px;vertical-align:middle}
.pts-glow{animation:glow 2s ease-in-out infinite}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
const TC={CSK:"#f9cd05",DC:"#4b8df8",GT:"#7bb8e0",KKR:"#7b5ea7",LSG:"#e03a76",MI:"#2d7dd2",PBKS:"#ed1c24",RR:"#e73895",RCB:"#e04f29",SRH:"#f47620"};
function re(r){return r==="Bat"?"🏏":r==="Bowler"?"🎯":r==="AR"?"🏏🎯":r==="WK"?"🧤":r}
function tb(t){const c=TC[t]||"#888";return`<span style="color:${c};font-weight:800;font-size:inherit">${t}</span>`}

const M={"Mintu Raval":{c:"#00F0FF",e:"👑",g:"linear-gradient(135deg,#00F0FF,#0080FF)"},"Kashish Khanuja":{c:"#FF2E97",e:"🔥",g:"linear-gradient(135deg,#FF2E97,#FF006E)"},"Naman Kothari":{c:"#39FF14",e:"⚡",g:"linear-gradient(135deg,#39FF14,#00CC00)"},"Viraj Patel":{c:"#FFE600",e:"🌟",g:"linear-gradient(135deg,#FFE600,#FF9500)"},"Kritik Khanuja":{c:"#BF40FF",e:"💎",g:"linear-gradient(135deg,#BF40FF,#8000FF)"}};
const R={
"KL Rahul":{m:"Mintu Raval",r:"WK",t:"DC"},"Mitchell Starc":{m:"Mintu Raval",r:"Bowler",t:"DC"},"Marco Jansen":{m:"Mintu Raval",r:"AR",t:"PBKS"},"Jasprit Bumrah":{m:"Mintu Raval",r:"Bowler",t:"MI"},"Phil Salt":{m:"Mintu Raval",r:"WK",t:"RCB"},"Varun Chakravarthy":{m:"Mintu Raval",r:"Bowler",t:"KKR"},"Dewald Brevis":{m:"Mintu Raval",r:"Bat",t:"CSK"},"Riyan Parag":{m:"Mintu Raval",r:"Bat",t:"RR"},"Ishan Kishan":{m:"Mintu Raval",r:"WK",t:"SRH"},"Shivam Dube":{m:"Mintu Raval",r:"AR",t:"CSK"},"Hardik Pandya":{m:"Mintu Raval",r:"AR",t:"MI"},"Dhruv Jurel":{m:"Mintu Raval",r:"WK",t:"RR"},"Angkrish Raghuvanshi":{m:"Mintu Raval",r:"Bat",t:"KKR"},"Vipraj Nigam":{m:"Mintu Raval",r:"AR",t:"DC"},"Rovman Powell":{m:"Mintu Raval",r:"Bat",t:"KKR"},
"Travis Head":{m:"Kashish Khanuja",r:"Bat",t:"SRH"},"Ruturaj Gaikwad":{m:"Kashish Khanuja",r:"Bat",t:"CSK"},"Sai Sudarshan":{m:"Kashish Khanuja",r:"AR",t:"GT"},"Virat Kohli":{m:"Kashish Khanuja",r:"Bat",t:"RCB"},"Jos Buttler":{m:"Kashish Khanuja",r:"WK",t:"GT"},"Mohammad Shami":{m:"Kashish Khanuja",r:"Bowler",t:"LSG"},"Noor Ahmed":{m:"Kashish Khanuja",r:"Bowler",t:"CSK"},"Kuldeep Yadav":{m:"Kashish Khanuja",r:"Bowler",t:"DC"},"Prabhsimran Singh":{m:"Kashish Khanuja",r:"Bat",t:"PBKS"},"Nehal Wadhera":{m:"Kashish Khanuja",r:"Bat",t:"PBKS"},"Tristan Stubbs":{m:"Kashish Khanuja",r:"WK",t:"DC"},"Matheesha Pathirana":{m:"Kashish Khanuja",r:"Bowler",t:"KKR"},"Harpreet Brar":{m:"Kashish Khanuja",r:"AR",t:"PBKS"},"Rinku Singh":{m:"Kashish Khanuja",r:"Bat",t:"KKR"},"Harshal Patel":{m:"Kashish Khanuja",r:"AR",t:"SRH"},
"Ravindra Jadeja":{m:"Naman Kothari",r:"AR",t:"RR"},"Shreyas Iyer":{m:"Naman Kothari",r:"Bat",t:"PBKS"},"Arshdeep Singh":{m:"Naman Kothari",r:"Bowler",t:"PBKS"},"Yashasvi Jaiswal":{m:"Naman Kothari",r:"Bat",t:"RR"},"Marcus Stoinis":{m:"Naman Kothari",r:"AR",t:"PBKS"},"Mohammed Siraj":{m:"Naman Kothari",r:"Bowler",t:"GT"},"Sunil Narine":{m:"Naman Kothari",r:"Bowler",t:"KKR"},"Josh Hazlewood":{m:"Naman Kothari",r:"Bowler",t:"RCB"},"Nicholas Pooran":{m:"Naman Kothari",r:"WK",t:"LSG"},"Washington Sundar":{m:"Naman Kothari",r:"AR",t:"GT"},"Tilak Varma":{m:"Naman Kothari",r:"Bat",t:"MI"},"Nitish Kumar Reddy":{m:"Naman Kothari",r:"AR",t:"SRH"},"Ajinkya Rahane":{m:"Naman Kothari",r:"Bat",t:"KKR"},"Sam Curran":{m:"Naman Kothari",r:"AR",t:"RR"},"Aniket Verma":{m:"Naman Kothari",r:"Bat",t:"SRH"},
"Shubman Gill":{m:"Viraj Patel",r:"Bat",t:"GT"},"Rachin Ravindra":{m:"Viraj Patel",r:"AR",t:"KKR"},"Mitchell Marsh":{m:"Viraj Patel",r:"AR",t:"LSG"},"Sanju Samson":{m:"Viraj Patel",r:"WK",t:"CSK"},"Matthew Short":{m:"Viraj Patel",r:"AR",t:"CSK"},"Yuzvendra Chahal":{m:"Viraj Patel",r:"Bowler",t:"PBKS"},"Aiden Markram":{m:"Viraj Patel",r:"Bat",t:"LSG"},"Abhishek Sharma":{m:"Viraj Patel",r:"AR",t:"SRH"},"Ravi Bishnoi":{m:"Viraj Patel",r:"Bowler",t:"RR"},"Pat Cummins":{m:"Viraj Patel",r:"Bowler",t:"SRH"},"Rishabh Pant":{m:"Viraj Patel",r:"WK",t:"LSG"},"Prithvi Shaw":{m:"Viraj Patel",r:"Bat",t:"DC"},"Sandeep Sharma":{m:"Viraj Patel",r:"Bowler",t:"RR"},"Shreyas Gopal":{m:"Viraj Patel",r:"Bowler",t:"CSK"},"Ramandeep Singh":{m:"Viraj Patel",r:"AR",t:"KKR"},
"Surya Kumar Yadav":{m:"Kritik Khanuja",r:"Bat",t:"MI"},"Vaibhav Suryavanshi":{m:"Kritik Khanuja",r:"Bat",t:"RR"},"Rashid Khan":{m:"Kritik Khanuja",r:"Bowler",t:"GT"},"Axar Patel":{m:"Kritik Khanuja",r:"AR",t:"DC"},"Trent Boult":{m:"Kritik Khanuja",r:"Bowler",t:"MI"},"Sai Kishore":{m:"Kritik Khanuja",r:"AR",t:"GT"},"Cameron Green":{m:"Kritik Khanuja",r:"AR",t:"KKR"},"Rajat Patidar":{m:"Kritik Khanuja",r:"Bat",t:"RCB"},"Krunal Pandya":{m:"Kritik Khanuja",r:"AR",t:"RCB"},"Abishek Porel":{m:"Kritik Khanuja",r:"WK",t:"DC"},"Khaleel Ahmed":{m:"Kritik Khanuja",r:"Bowler",t:"CSK"},"Harshit Rana":{m:"Kritik Khanuja",r:"Bowler",t:"KKR"},"Priyansh Arya":{m:"Kritik Khanuja",r:"AR",t:"PBKS"},"Finn Allen":{m:"Kritik Khanuja",r:"WK",t:"KKR"},"Romario Shepherd":{m:"Kritik Khanuja",r:"AR",t:"RCB"}
};
const P={r:1,w:25,c:5,ro:5};
const MA=[
{id:"M1",ti:"RCB vs SRH",dt:"Mar 28",rs:"RCB won by 6 wkts",t1:"RCB",t2:"SRH",
b:{"Phil Salt":8,"Virat Kohli":69,"Rajat Patidar":31,"Abhishek Sharma":7,"Travis Head":11,"Ishan Kishan":80,"Nitish Kumar Reddy":4,"Aniket Verma":43,"Harshal Patel":2},
w:{"Romario Shepherd":3},ct:{"Phil Salt":3,"Virat Kohli":1},ro:{}},
{id:"M2",ti:"MI vs KKR",dt:"Mar 29",rs:"MI won by 6 wkts",t1:"MI",t2:"KKR",
b:{"Finn Allen":37,"Ajinkya Rahane":67,"Cameron Green":18,"Angkrish Raghuvanshi":51,"Rinku Singh":33,"Ramandeep Singh":4,"Surya Kumar Yadav":16,"Hardik Pandya":18,"Tilak Varma":20},
w:{"Hardik Pandya":1,"Sunil Narine":1},ct:{"Tilak Varma":2,"Hardik Pandya":1,"Rinku Singh":1},ro:{}},
{id:"M3",ti:"RR vs CSK",dt:"Mar 30",rs:"RR won by 8 wkts",t1:"RR",t2:"CSK",
b:{"Sanju Samson":6,"Ruturaj Gaikwad":6,"Shivam Dube":6,"Noor Ahmed":1,"Matthew Short":2,"Vaibhav Suryavanshi":52,"Yashasvi Jaiswal":38,"Dhruv Jurel":18,"Riyan Parag":14},
w:{"Ravindra Jadeja":2,"Sandeep Sharma":1,"Ravi Bishnoi":1},ct:{"Dhruv Jurel":2,"Ravi Bishnoi":1},ro:{}}
];
let st={tab:"board",exp:null,selM:MA.length-1,selT:"Mintu Raval"};
function calc(){
  let mg={},ps={};
  Object.keys(M).forEach(k=>{mg[k]={r:0,w:0,c:0,ro:0,tot:0,pl:[]}});
  Object.entries(R).forEach(([p,i])=>{ps[p]={n:p,r:0,w:0,c:0,ro:0,pt:0,mg:i.m,rl:i.r,t:i.t}});
  MA.forEach(match=>{
    Object.entries(R).forEach(([p,i])=>{
      let r=match.b?.[p]||0,w=match.w?.[p]||0,c=match.ct?.[p]||0,ro=match.ro?.[p]||0;
      if(r>0||w>0||c>0||ro>0){let pt=r*P.r+w*P.w+c*P.c+ro*P.ro;
      mg[i.m].r+=r;mg[i.m].w+=w;mg[i.m].c+=c;mg[i.m].ro+=ro;mg[i.m].tot+=pt;
      mg[i.m].pl.push({n:p,r,w,c,ro,pt,t:i.t,mt:match.ti});
      ps[p].r+=r;ps[p].w+=w;ps[p].c+=c;ps[p].ro+=ro;ps[p].pt+=pt}
    });
  });
  return{mg,so:Object.entries(mg).sort((a,b)=>b[1].tot-a[1].tot),tp:Object.values(ps).filter(x=>x.pt>0).sort((a,b)=>b.pt-a.pt).slice(0,20),ps};
}
function pb(p){let s=[];if(p.r>0)s.push(p.r+"r");if(p.w>0)s.push(p.w+"w");if(p.c>0)s.push(p.c+"c");if(p.ro>0)s.push(p.ro+"ro");return s.join(" + ")}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function animNum(id,target){
  const el=document.getElementById(id);if(!el)return;
  let cur=0;const step=Math.max(1,Math.floor(target/30));
  const iv=setInterval(()=>{cur+=step;if(cur>=target){cur=target;clearInterval(iv)}el.textContent=cur},20);
}
function render(){
  const{mg,so,tp,ps}=calc();const ld=so[0],ln=ld[0],lv=ld[1],lc=M[ln];
  const bd="#1a1a3e";
  // Header
  let h=`<div style="text-align:center;padding:22px 0 16px"><div style="font-size:32px;font-weight:900;background:linear-gradient(90deg,#00F0FF,#FF2E97,#BF40FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent">🏏 Fantasy IPL 2026</div><div style="display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:11px;color:#555"><span>🏏 1 Run = 1pt</span><span>🎯 1 Wkt = 25pt</span><span>🧤 1 Ct/RO = 5pt</span></div></div>`;
  // Status
  h+=`<div style="display:flex;align-items:center;justify-content:space-between;background:#0a0a1a;border-radius:12px;padding:10px 16px;margin-bottom:14px;border:1px solid ${bd}"><div><span class="live-dot"></span><span style="color:#00F0FF;font-weight:800;font-size:12px">${MA.length} Matches Tracked</span></div><div style="font-size:11px;color:#555">Next: ${tb("PBKS")} vs ${tb("GT")} · Mar 31</div></div>`;
  // Leader
  h+=`<div class="hdr" style="border-color:${lc.c}33;box-shadow:0 0 30px ${lc.c}10"><div style="position:absolute;right:-20px;top:-20px;font-size:100px;opacity:.03">🏆</div><div style="display:flex;align-items:center;gap:6px;margin-bottom:10px"><span style="background:${lc.c}20;color:${lc.c};padding:4px 12px;border-radius:6px;font-weight:800;font-size:10px;letter-spacing:1px;border:1px solid ${lc.c}33">🏆 #1 LEADER</span></div><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:26px;font-weight:900;color:#fff">${lc.e} ${esc(ln)}</div><div style="display:flex;gap:14px;margin-top:8px;font-size:12px;color:#666"><span>🏏 ${lv.r} runs</span><span>🎯 ${lv.w} wkts</span><span>🧤 ${lv.c} ct</span></div></div><div style="text-align:right"><div id="leader-pts" class="pts-glow" style="font-size:50px;font-weight:900;color:${lc.c};line-height:1;--gc:${lc.c}40">0</div><div style="font-size:10px;color:#555;margin-top:4px">POINTS</div></div></div>${so.length>1?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid #1a1a3e;font-size:12px;color:${lc.c}">▲ ${lv.tot-so[1][1].tot} pts ahead of ${so[1][0]}</div>`:""}</div>`;
  // Tabs
  h+=`<div class="tab">${[["board","🏆 Board"],["squads","👥 Squads"],["highlights","🎯 Matches"],["players","👤 Players"]].map(([k,l])=>`<div class="${st.tab===k?"on":""}" onclick="st.tab='${k}';render()">${l}</div>`).join("")}</div>`;

  // === LEADERBOARD ===
  if(st.tab==="board"){so.forEach(([n,d],i)=>{const c=M[n],isE=st.exp===n,bw=ld[1].tot>0?(d.tot/ld[1].tot)*100:0;
  h+=`<div class="card ri" style="cursor:pointer;animation-delay:${i*.08}s;${i===0?`box-shadow:0 0 20px ${c.c}10;border-color:${c.c}33`:""}" onclick="st.exp=st.exp==='${esc(n)}'?null:'${esc(n)}';render()"><div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:12px"><div style="width:42px;height:42px;border-radius:12px;background:${c.g};display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:17px;box-shadow:0 0 15px ${c.c}30">${i===0?"👑":i+1}</div><div><div style="font-weight:800;font-size:17px;color:#fff">${c.e} ${esc(n)}</div><div style="font-size:11px;color:#555;margin-top:3px">${d.r}r · ${d.w}w · ${d.c}c · ${d.pl.length} scorers</div></div></div><div style="text-align:right"><div id="board-pts-${i}" style="font-size:30px;font-weight:900;color:${c.c};text-shadow:0 0 10px ${c.c}30">0</div><div style="font-size:9px;color:#444;font-weight:700">PTS</div></div></div><div class="bar"><div style="width:${bw}%;background:${c.g};box-shadow:0 0 6px ${c.c}40"></div></div>`;
  if(isE&&d.pl.length>0){h+=`<div style="margin-top:12px;border-top:1px solid ${bd};padding-top:10px"><div style="font-size:10px;font-weight:700;color:#444;margin-bottom:8px;letter-spacing:1.5px">SCORING PLAYERS</div>`;d.pl.sort((a,b)=>b.pt-a.pt).forEach((p,j)=>{h+=`<div class="ri" style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:${j<d.pl.length-1?"1px solid #111":"none"};animation-delay:${j*.05}s"><div><span style="font-size:12px;margin-right:4px">${re(R[p.n]?.r||"")}</span><span style="font-weight:700;font-size:14px;color:#ddd">${esc(p.n)}</span><span style="font-size:10px;color:#555;margin-left:6px">${tb(p.t)} · ${p.mt}</span></div><div style="font-weight:800;color:${c.c};font-size:14px;text-shadow:0 0 6px ${c.c}30">${pb(p)} = ${p.pt}</div></div>`});h+=`</div>`}
  h+=`</div>`})}

  // === SQUADS ===
  if(st.tab==="squads"){
    const tc=M[st.selT];const sqPl=Object.values(ps).filter(p=>p.mg===st.selT).sort((a,b)=>b.pt-a.pt);
    h+=`<div style="display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap">${Object.keys(M).map(n=>`<div onclick="st.selT='${esc(n)}';render()" style="flex:1;min-width:55px;padding:9px 4px;border-radius:10px;cursor:pointer;font-weight:700;font-size:11px;text-align:center;border:1px solid ${st.selT===n?M[n].c+"55":bd};background:${st.selT===n?M[n].c+"11":"#0a0a1a"};color:${st.selT===n?M[n].c:"#555"};${st.selT===n?"box-shadow:0 0 10px "+M[n].c+"20":""}">${M[n].e}<br>${n.split(" ")[0]}</div>`).join("")}</div>`;
    h+=`<div class="card" style="border-color:${tc.c}33;box-shadow:0 0 20px ${tc.c}08"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><div style="font-size:22px;font-weight:900;color:#fff">${tc.e} ${esc(st.selT)}</div><div style="font-size:12px;color:#555;margin-top:3px">15 players</div></div><div id="squad-pts" style="font-size:34px;font-weight:900;color:${tc.c};text-shadow:0 0 12px ${tc.c}30">0</div></div>`;
    h+=`<div style="display:grid;grid-template-columns:1fr 40px 30px 30px 50px;font-size:10px;font-weight:700;color:#444;padding-bottom:8px;border-bottom:1px solid ${bd};letter-spacing:.5px"><div>PLAYER</div><div style="text-align:center">R</div><div style="text-align:center">W</div><div style="text-align:center">C</div><div style="text-align:right">PTS</div></div>`;
    sqPl.forEach((p,i)=>{h+=`<div class="ri" style="display:grid;grid-template-columns:1fr 40px 30px 30px 50px;padding:9px 0;border-bottom:1px solid #111;align-items:center;animation-delay:${i*.04}s"><div><div style="display:flex;align-items:center;gap:4px"><span style="font-size:11px">${re(p.rl)}</span><span style="font-weight:700;font-size:13px;color:${p.pt>0?"#ddd":"#333"}">${esc(p.n)}</span></div><div style="font-size:10px;color:#333;margin-top:1px;margin-left:18px">${tb(p.t)}</div></div><div style="text-align:center;color:${p.r>0?"#ddd":"#222"};font-weight:700;font-size:12px">${p.r||"-"}</div><div style="text-align:center;color:${p.w>0?"#39FF14":"#222"};font-weight:700;font-size:12px">${p.w||"-"}</div><div style="text-align:center;color:${p.c>0?"#00F0FF":"#222"};font-weight:700;font-size:12px">${p.c||"-"}</div><div style="text-align:right;font-weight:900;font-size:14px;color:${p.pt>0?tc.c:"#181818"};${p.pt>0?"text-shadow:0 0 6px "+tc.c+"30":""}">${p.pt||"0"}</div></div>`});
    h+=`</div>`;
  }

  // === MATCH HIGHLIGHTS ===
  if(st.tab==="highlights"){
    h+=`<div style="display:flex;gap:6px;margin-bottom:14px">${MA.map((mt,i)=>`<div onclick="st.selM=${i};render()" style="flex:1;padding:12px 6px;border-radius:12px;cursor:pointer;text-align:center;border:1px solid ${st.selM===i?"#FF2E9755":bd};background:${st.selM===i?"#FF2E9711":"#0a0a1a"};${st.selM===i?"box-shadow:0 0 10px #FF2E9715":""}"><div style="font-size:13px;font-weight:800;color:${st.selM===i?"#FF2E97":"#555"}">${tb(mt.t1)} <span style="color:#333;font-size:10px">v</span> ${tb(mt.t2)}</div><div style="font-size:9px;color:#444;margin-top:4px">${mt.dt}</div></div>`).join("")}</div>`;
    const match=MA[st.selM],sc=[];
    Object.entries(R).forEach(([p,i])=>{let r=match.b?.[p]||0,w=match.w?.[p]||0,c=match.ct?.[p]||0,ro=match.ro?.[p]||0;if(r>0||w>0||c>0||ro>0)sc.push({n:p,r,w,c,ro,pt:r*P.r+w*P.w+c*P.c+ro*P.ro,mg:i.m,t:i.t,rl:i.r})});
    sc.sort((a,b)=>b.pt-a.pt);
    h+=`<div class="card"><div style="margin-bottom:14px"><div style="font-size:20px;font-weight:800;color:#fff">${tb(match.t1)} <span style="color:#333;font-size:14px">vs</span> ${tb(match.t2)}</div><div style="font-size:12px;color:#555;margin-top:6px">${match.dt} · <span style="color:#FF2E97;font-weight:700">${match.rs}</span></div></div>`;
    sc.forEach((s,i)=>{const mc=M[s.mg];h+=`<div class="ri" style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;margin-bottom:6px;border-radius:12px;background:${i===0?"#0d0d25":"#080815"};border:1px solid ${i===0?mc?.c+"33":"#151530"};animation-delay:${i*.06}s;${i===0?"box-shadow:0 0 15px "+mc?.c+"15":""}"><div style="display:flex;align-items:center;gap:10px"><div style="width:32px;height:32px;border-radius:10px;background:${mc?.g};display:flex;align-items:center;justify-content:center;font-size:13px;color:#000;font-weight:800;box-shadow:0 0 10px ${mc?.c}30">${i===0?"⭐":i+1}</div><div><div style="font-size:14px;font-weight:700;color:#ddd"><span style="margin-right:3px">${re(s.rl)}</span>${esc(s.n)}</div><div style="font-size:10px;color:#555;margin-top:2px">${tb(s.t)} · ${mc?.e} ${s.mg.split(" ")[0]}</div></div></div><div style="text-align:right"><div style="font-weight:900;font-size:22px;color:${mc?.c};text-shadow:0 0 8px ${mc?.c}30">${s.pt}</div><div style="font-size:9px;color:#555">${pb(s)}</div></div></div>`});
    h+=`</div>`;
  }

  // === TOP PLAYERS ===
  if(st.tab==="players"){h+=`<div class="card">`;tp.forEach((p,i)=>{const mc=M[p.mg];h+=`<div class="ri" style="display:flex;align-items:center;justify-content:space-between;padding:11px 0;${i<tp.length-1?"border-bottom:1px solid #111":""};animation-delay:${i*.04}s"><div style="display:flex;align-items:center;gap:10px"><span style="font-weight:900;font-size:16px;width:30px;text-align:center;color:${i===0?"#00F0FF":i<3?"#888":"#444"}">${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</span><div><div style="font-size:15px;font-weight:700;color:#ddd"><span style="margin-right:3px">${re(p.rl)}</span>${esc(p.n)}</div><div style="font-size:10px;color:#555;margin-top:2px">${tb(p.t)} · <span style="color:${mc?.c};font-weight:700">${mc?.e} ${p.mg.split(" ")[0]}</span></div></div></div><div style="text-align:right"><div style="font-weight:900;font-size:22px;color:${mc?.c};text-shadow:0 0 8px ${mc?.c}30">${p.pt}</div><div style="font-size:9px;color:#555">${pb(p)}</div></div></div>`});h+=`</div>`}

  h+=`<div style="text-align:center;margin-top:24px;padding:16px 0;border-top:1px solid #1a1a3e"><div style="font-size:10px;color:#333;font-weight:700;letter-spacing:1.5px">FANTASY IPL 2026 · 5 MANAGERS · 75 PLAYERS · ${MA.length} MATCHES</div></div>`;
  document.getElementById("app").innerHTML=h;
  // Animate counters
  animNum("leader-pts",lv.tot);
  if(st.tab==="board")so.forEach(([n,d],i)=>animNum("board-pts-"+i,d.tot));
  if(st.tab==="squads")animNum("squad-pts",mg[st.selT].tot);
}
render();
</script>
</body>
</html>
