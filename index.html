<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Fantasy IPL 2026</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;background:#0b1023;color:#e4e8f7;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 80% 60% at 20% 10%,rgba(56,189,248,.1) 0%,transparent 60%),
  radial-gradient(ellipse 60% 50% at 80% 90%,rgba(139,92,246,.1) 0%,transparent 60%),
  radial-gradient(ellipse 50% 40% at 50% 50%,rgba(236,72,153,.06) 0%,transparent 60%);
  z-index:0;pointer-events:none}
.w{max-width:640px;margin:0 auto;padding:14px 14px 50px;position:relative;z-index:1}

/* Glass cards */
.gc{background:linear-gradient(135deg,rgba(15,23,60,.7),rgba(20,30,70,.5));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(100,140,255,.12);border-radius:16px;padding:14px;margin-bottom:10px;transition:all .3s;box-shadow:0 4px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.06)}
.gc:hover{border-color:rgba(100,140,255,.22);box-shadow:0 8px 32px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08)}

/* Leader glass — stronger */
.gc-lead{background:linear-gradient(135deg,rgba(15,25,65,.8),rgba(25,35,80,.6));backdrop-filter:blur(50px) saturate(200%);-webkit-backdrop-filter:blur(50px) saturate(200%);border:1px solid rgba(100,160,255,.18);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 8px 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(255,255,255,.03);position:relative;overflow:hidden}
.gc-lead::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(100,180,255,.3),transparent)}

/* Tabs */
.tab-bar{display:flex;gap:4px;margin-bottom:14px;position:sticky;top:0;z-index:10;padding:8px 0 6px;background:linear-gradient(180deg,#0b1023 70%,transparent)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 5px;border-radius:12px;cursor:pointer;font-weight:600;font-size:9px;text-align:center;background:rgba(15,23,55,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#4a5580;border:1px solid rgba(100,140,255,.06);transition:all .25s;letter-spacing:.3px;user-select:none}
.tb .ti{font-size:13px;line-height:1}
.tb.on{background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(139,92,246,.1));color:#7dd3fc;border-color:rgba(56,189,248,.25);box-shadow:0 0 16px rgba(56,189,248,.08)}

/* Stat pills */
.stat-pill{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(15,23,60,.8),rgba(20,30,70,.5));border:1px solid rgba(100,140,255,.1);border-radius:12px;padding:10px 14px;flex:1;min-width:0}
.stat-pill .sp-val{font-size:20px;font-weight:800;line-height:1}
.stat-pill .sp-lbl{font-size:9px;color:#4a5580;font-weight:700;letter-spacing:1px;text-transform:uppercase}

/* Progress bar */
.bar{height:4px;background:rgba(100,140,255,.08);border-radius:4px;margin-top:10px;overflow:hidden}
.bar div{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.22,1,.36,1)}

/* Animations */
.ri{animation:ri .5s cubic-bezier(.22,1,.36,1) both}
@keyframes ri{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes glow{0%,100%{text-shadow:0 0 6px var(--gc)}50%{text-shadow:0 0 16px var(--gc),0 0 32px var(--gc)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.gl{animation:glow 2.5s ease-in-out infinite}
.float{animation:float 3s ease-in-out infinite}
.ld-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#38bdf8;animation:pulse 1.5s infinite;margin-right:5px;vertical-align:middle}

.dh{background:linear-gradient(90deg,rgba(236,72,153,.12),transparent);border-left:3px solid #ec4899;padding:5px 12px;border-radius:0 10px 10px 0;font-size:10px;font-weight:800;color:#ec4899;margin-bottom:8px;letter-spacing:1px}
.header-title{font-size:26px;font-weight:900;background:linear-gradient(135deg,#38bdf8,#818cf8,#c084fc,#e879f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pts-label{font-size:8px;color:#4a5580;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.grid-header{display:grid;font-size:9px;font-weight:700;color:#4a5580;padding-bottom:8px;border-bottom:1px solid rgba(100,140,255,.06);letter-spacing:.5px;margin-bottom:2px}
.grid-row{display:grid;padding:8px 0;border-bottom:1px solid rgba(100,140,255,.04);align-items:center}
.section-title{font-size:9px;font-weight:800;color:#4a5580;letter-spacing:1.5px;margin-bottom:8px;text-transform:uppercase}
.badge{padding:3px 9px;border-radius:8px;font-weight:700;font-size:9px;letter-spacing:.5px;display:inline-block}
.score-chip{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:5px;border-radius:14px;border:1px solid rgba(100,140,255,.08);transition:all .25s;background:rgba(15,23,55,.4)}
.score-chip:hover{background:rgba(15,23,55,.7);transform:translateX(2px)}

.avatar-lg{width:86px;height:86px;border-radius:20px;flex-shrink:0;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.avatar-lg svg{width:100%;height:100%;display:block}
.avatar-sm{width:44px;height:44px;border-radius:12px;flex-shrink:0;overflow:hidden}
.avatar-sm svg{width:100%;height:100%;display:block}
.avatar-sq{width:48px;height:48px;border-radius:13px;flex-shrink:0;overflow:hidden}
.avatar-sq svg{width:100%;height:100%;display:block}

@media(max-width:380px){.tb{font-size:8px;padding:6px 1px 4px}.header-title{font-size:22px}.avatar-lg{width:72px;height:72px;border-radius:16px}.stat-pill .sp-val{font-size:16px}}
</style>
</head>

    sc.forEach((s,i)=>{
      const mc=M[s.mg];
      h+=`<div class="score-chip ri" style="animation-delay:${i*.04}s;${i===0?`border-color:${mc?.c}20;background:linear-gradient(135deg,${mc?.c}08,transparent)`:""};cursor:default">
        <div style="width:26px;height:26px;border-radius:8px;background:${mc?.g};display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:800;flex-shrink:0">${i===0?"⭐":i+1}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:11px;font-weight:700">${re(s.rl)} ${esc(s.n)}</div>
          <div style="font-size:8px;color:#4a5580;margin-top:1px">${tb(s.t)} · ${mc?.e} ${s.mg.split(" ")[0]}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-weight:900;font-size:16px;color:${mc?.c}">${s.pt}</div>
          <div style="font-size:7px;color:#4a5580">${pb(s)}</div>
        </div>
      </div>`;
    });
    h+=`</div>`;
  }

  // === PLAYERS ===
  if(st.tab==="players"){
    h+=`<div class="gc">`;
    tp.forEach((p,i)=>{
      const mc=M[p.mg];
      h+=`<div class="ri" style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;${i<tp.length-1?"border-bottom:1px solid rgba(100,140,255,.04)":""};animation-delay:${i*.03}s">
        <div style="display:flex;align-items:center;gap:9px">
          <span style="font-weight:900;font-size:13px;width:24px;text-align:center;color:${i<3?"#38bdf8":"#3a4570"}">${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</span>
          <div>
            <div style="font-size:12px;font-weight:700">${re(p.rl)} ${esc(p.n)}</div>
            <div style="font-size:9px;color:#4a5580;margin-top:1px">${tb(p.t)} · <span style="color:${mc?.c}">${mc?.e} ${p.mg.split(" ")[0]}</span></div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:900;font-size:16px;color:${mc?.c}">${p.pt}</div>
          <div style="font-size:7px;color:#4a5580">${pb(p)}</div>
        </div>
      </div>`;
    });
    h+=`</div>`;
  }

  // === NEXT ===
  if(st.tab==="next"&&next){
    const p1=getPlayersForTeam(next.t1),p2=getPlayersForTeam(next.t2);
    h+=`<div class="gc-lead" style="text-align:center;padding:20px">
      <div style="font-size:9px;color:#c084fc;font-weight:800;letter-spacing:2px;margin-bottom:8px">🔮 NEXT MATCH PREVIEW</div>
      <div style="font-size:18px;font-weight:900">${tb(next.t1)} <span style="color:#3a4570;font-size:13px;margin:0 6px">vs</span> ${tb(next.t2)}</div>
      <div style="font-size:11px;color:#4a5580;margin-top:6px">Match ${next.n} · ${next.dt} · ${next.v}</div>
    </div>`;
    [["t1",next.t1,p1],["t2",next.t2,p2]].forEach(([k,t,pls])=>{
      if(pls.length===0)return;
      h+=`<div class="gc ri" style="animation-delay:.1s">
        <div style="font-size:12px;font-weight:800;color:${TC[t]};margin-bottom:10px">${tb(t)} — Fantasy Players (${pls.length})</div>`;
      pls.forEach((p,i)=>{
        h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:${i<pls.length-1?"1px solid rgba(100,140,255,.04)":"none"}">
          <div>${re(p.r)} <span style="font-weight:700;font-size:11px">${esc(p.n)}</span></div>
          <span style="color:${p.mc.c};font-weight:700;font-size:9px">${p.mc.e} ${p.m.split(" ")[0]}</span>
        </div>`;
      });
      h+=`</div>`;
    });
  }

  // === TABLE ===
  if(st.tab==="table"){
    h+=`<div class="gc">
      <div style="font-size:14px;font-weight:800;color:#38bdf8;margin-bottom:12px">📊 IPL 2026 Standings</div>`;
    h+=`<div class="grid-header" style="grid-template-columns:24px 1fr 28px 28px 28px 50px 36px"><div>#</div><div>TEAM</div><div style="text-align:center">M</div><div style="text-align:center">W</div><div style="text-align:center">L</div><div style="text-align:right">NRR</div><div style="text-align:right">PTS</div></div>`;
    PT.forEach((t,i)=>{
      h+=`<div class="ri grid-row" style="grid-template-columns:24px 1fr 28px 28px 28px 50px 36px;animation-delay:${i*.03}s">
        <div style="font-weight:800;font-size:11px;color:${i<4?"#38bdf8":"#3a4570"}">${i+1}</div>
        <div style="font-weight:800;font-size:12px;color:${TC[t.t]}">${t.t}</div>
        <div style="text-align:center;color:#6b7aaa;font-weight:700;font-size:10px">${t.m}</div>
        <div style="text-align:center;color:#4ade80;font-weight:700;font-size:10px">${t.w||"-"}</div>
        <div style="text-align:center;color:${t.l>0?"#f87171":"#1a2040"};font-weight:700;font-size:10px">${t.l||"-"}</div>
        <div style="text-align:right;color:${parseFloat(t.nrr)>0?"#4ade80":parseFloat(t.nrr)<0?"#f87171":"#3a4570"};font-weight:700;font-size:9px">${t.nrr}</div>
        <div style="text-align:right;font-weight:900;font-size:13px;color:${t.pts>0?"#38bdf8":"#111828"}">${t.pts}</div>
      </div>`;
    });
    h+=`<div style="margin-top:10px;padding-top:8px;border-top:1px solid rgba(100,140,255,.06);font-size:9px;color:#3a4570">Top 4 qualify for playoffs · 2pts per win</div></div>`;
  }

  // === SCHEDULE ===
  if(st.tab==="schedule"){
    h+=`<div style="font-size:14px;font-weight:800;color:#38bdf8;margin-bottom:12px">📅 IPL 2026 Schedule</div>`;
    let prevDt="";
    SCH.forEach((s,i)=>{
      if(s.dh&&s.dt!==prevDt){h+=`<div class="dh">🔥 DOUBLE HEADER · ${s.dt}</div>`}
      prevDt=s.dt;
      h+=`<div class="gc ri" style="padding:10px 13px;animation-delay:${i*.03}s;${s.done?"opacity:.4":""}">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div>
            <div style="font-size:12px;font-weight:800">${tb(s.t1)} <span style="color:#3a4570;font-size:9px">vs</span> ${tb(s.t2)}</div>
            <div style="font-size:9px;color:#3a4570;margin-top:3px">#${s.n} · ${s.dt} · ${s.v}</div>
          </div>
          <div>${s.done?`<span class="badge" style="background:rgba(74,222,128,.08);color:#4ade80;border:1px solid rgba(74,222,128,.15)">✓ Done</span>`:`<span class="badge" style="background:rgba(56,189,248,.08);color:#38bdf8;border:1px solid rgba(56,189,248,.15)">Upcoming</span>`}</div>
        </div>
      </div>`;
    });
  }

  h+=`<div style="text-align:center;margin-top:20px;padding:14px 0;border-top:1px solid rgba(100,140,255,.06)">
    <div style="font-size:8px;color:#3a4570;font-weight:700;letter-spacing:1.5px">FANTASY IPL 2026 · 5 MANAGERS · 75 PLAYERS · ${MA.length} MATCHES</div>
  </div>`;

  document.getElementById("app").innerHTML=h;
  animNum("lp",lv.tot);
  if(st.tab==="squads")animNum("sp",mg[st.selT].tot);
}
render();
</script>
</body>
</html>
