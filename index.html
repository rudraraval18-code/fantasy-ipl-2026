<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07070f">
<title>Fantasy IPL 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏏</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',system-ui,sans-serif;background:#07070f;color:#f1f5f9;min-height:100vh;overflow-x:hidden;padding-bottom:100px}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:100vh;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(124,58,237,.18),transparent),radial-gradient(ellipse 50% 40% at 100% 60%,rgba(236,72,153,.08),transparent);pointer-events:none;z-index:0}
.w{max-width:640px;margin:0 auto;padding:14px 14px 20px;position:relative;z-index:1}
@media(min-width:768px){.w{max-width:1200px;padding:20px 24px 28px}}

/* ── CARDS ── */
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 16px 40px rgba(0,0,0,.4);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 20px 48px rgba(0,0,0,.5)}
.card-hi{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}

/* ── HERO ── */
.hero{background:linear-gradient(160deg,#0a0019 0%,#160833 45%,#0a1530 100%);border-radius:26px;padding:26px 22px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 30px 60px rgba(0,0,0,.6)}
.hero::before{content:'';position:absolute;top:-80px;right:-60px;width:280px;height:280px;background:radial-gradient(circle,rgba(124,58,237,.22),transparent 65%);border-radius:50%;pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-60px;left:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(236,72,153,.14),transparent 65%);border-radius:50%;pointer-events:none}

/* ── NAV ── */
.bnav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));background:rgba(12,10,28,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);display:flex;z-index:100;padding:6px;box-shadow:0 0 0 1px rgba(255,255,255,.05) inset,0 20px 48px rgba(0,0,0,.7);border-radius:22px;gap:4px}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 6px;cursor:pointer;font-weight:800;font-size:10px;color:rgba(241,245,249,.4);transition:all .2s;user-select:none;border-radius:16px;letter-spacing:.2px}
.bnav-item .bi{font-size:17px;line-height:1;transition:transform .2s}
.bnav-item.on{color:#f1f5f9;background:rgba(255,255,255,.1);box-shadow:0 1px 0 rgba(255,255,255,.12) inset}
.bnav-item.on .bi{transform:scale(1.1)}

/* ── TYPOGRAPHY ── */
.label{font-size:9px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:rgba(241,245,249,.35)}
.section-title{font-size:9px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:rgba(241,245,249,.35);margin-bottom:12px}
.pts-num{font-size:28px;font-weight:900;line-height:1}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:9px;font-weight:800;letter-spacing:.3px}

/* ── BARS ── */
.bar{height:4px;background:rgba(255,255,255,.06);border-radius:999px;margin-top:10px;overflow:hidden}
.bar div{height:100%;border-radius:999px;transition:width .9s cubic-bezier(.22,1,.36,1)}

/* ── GRID HEADERS ── */
.gh{display:grid;font-size:9px;font-weight:700;color:rgba(241,245,249,.3);padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06);letter-spacing:.6px;margin-bottom:4px}
.gr{display:grid;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center}

/* ── NAV ARROWS ── */
.nav-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:all .2s;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.nav-btn:active{transform:scale(.92)}
.nav-btn-off{opacity:.3;cursor:default;pointer-events:none}

/* ── TEAM CHIPS ── */
.team-chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:9px;font-weight:800}

/* ── AVATARS ── */
.av{border-radius:16px;overflow:hidden;flex-shrink:0;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.av svg,.av img{width:100%;height:100%;display:block}

/* ── MANAGER CARDS ── */
.mgr-card{border-radius:20px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.mgr-card::before{content:'';position:absolute;top:0;left:0;width:3px;bottom:0;border-radius:3px 0 0 3px}

/* ── ANIMATIONS ── */
.ri{animation:ri .4s cubic-bezier(.22,1,.36,1) both}
@keyframes ri{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
.pulse{animation:pulse 2s ease-in-out infinite}

/* ── SQUADS ── */
.squad-tab{padding:9px 14px;border-radius:14px;cursor:pointer;font-weight:800;font-size:10px;text-align:center;transition:all .2s;border:1.5px solid transparent;white-space:nowrap}

/* ── RANK BADGES ── */
.rank-1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000}
.rank-2{background:rgba(226,232,240,.15);color:#cbd5e1}
.rank-3{background:rgba(205,127,50,.25);color:#cd7f32}

/* ── HIGHLIGHTS RESULT ── */
.result-bar{padding:8px 14px;border-radius:10px;font-size:10px;font-weight:800;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:#4ade80;margin-bottom:10px}

/* ── RESPONSIVE ── */
@media(max-width:640px){body{padding-bottom:110px}.hero{padding:20px 16px;border-radius:22px}}
@media(max-width:380px){.bnav-item{font-size:9px;padding:8px 4px}}
</style>
</head>

      </div>
    </div>`;

    // ── BRACKET ────────────────────────────────────────────────────
    function matchCard(m,size){
      const isDone=m.done,w=m.winner||"";
      const labelCfg={q1:{bg:"rgba(139,92,246,.15)",border:"rgba(139,92,246,.3)",txt:"#a78bfa",label:"Qualifier 1"},el:{bg:"rgba(6,182,212,.15)",border:"rgba(6,182,212,.3)",txt:"#22d3ee",label:"Eliminator"},q2:{bg:"rgba(245,158,11,.15)",border:"rgba(245,158,11,.3)",txt:"#fbbf24",label:"Qualifier 2"},fn:{bg:"rgba(220,38,38,.18)",border:"rgba(220,38,38,.45)",txt:"#fb7185",label:"Grand Final"}};
      const cfg=labelCfg[m.cls]||labelCfg.q1;
      const isFinal=m.cls==="fn";
      return`<div style="background:${isDone?"linear-gradient(135deg,rgba(30,20,60,.95),rgba(15,10,40,.98))":"linear-gradient(135deg,rgba(22,16,50,.9),rgba(12,8,32,.95))"};border-radius:${isFinal?"22px":"18px"};border:1.5px solid ${isDone?cfg.border:"rgba(255,255,255,.06)"};padding:${isFinal?"18px":"14px"};position:relative;overflow:hidden;box-shadow:${isDone?"0 12px 30px rgba(0,0,0,.4)":"0 6px 18px rgba(0,0,0,.3)"};transition:all .3s">
        ${isDone?`<div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,${cfg.txt},transparent)"></div>`:""}
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${isFinal?"14px":"10px"}">
          <div style="font-size:9px;font-weight:800;color:${cfg.txt};letter-spacing:1.5px;text-transform:uppercase">${cfg.label}</div>
          <div style="font-size:8px;color:rgba(255,255,255,.3);font-weight:700">${m.dt} · ${m.v}</div>
        </div>
        ${[m.t1,m.t2].map(t=>{
          const isW=isDone&&t===w;
          const isTBD=t==="TBD";
          const tc=isTBD?"rgba(255,255,255,.2)":(TC[t]||"#888");
          return`<div style="display:flex;align-items:center;justify-content:space-between;padding:${isFinal?"11px 12px":"9px 10px"};border-radius:12px;margin-bottom:6px;background:${isW?tc+"28":"rgba(255,255,255,.04)"};border:1.5px solid ${isW?tc+"50":"rgba(255,255,255,.06)"};transition:all .3s">
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:8px;height:8px;border-radius:50%;background:${isTBD?"rgba(255,255,255,.15)":tc};box-shadow:${isW?"0 0 10px "+tc:"none"}"></div>
              <span style="font-weight:${isW?"900":"700"};font-size:${isFinal?"15px":"13px"};color:${isTBD?"rgba(255,255,255,.25)":isW?"#fff":tc}">${isTBD?"TBD":t}</span>
            </div>
            ${isW?`<div style="display:flex;align-items:center;gap:5px"><div style="width:18px;height:18px;background:${tc};border-radius:50%;display:grid;place-items:center;font-size:9px">✓</div><span style="font-size:9px;font-weight:900;color:${tc}">${isFinal?"CHAMPION":"WINNER"}</span></div>`:""}
          </div>`;
        }).join("")}
        ${isDone&&m.rs?`<div style="margin-top:8px;padding:6px 10px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);border-radius:8px;font-size:9px;font-weight:800;color:#4ade80">${m.rs}</div>`:!isDone?`<div style="margin-top:8px;padding:6px 10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:8px;font-size:9px;font-weight:700;color:rgba(255,255,255,.3)">⏳ Upcoming</div>`:""}
      </div>`;
    }

    h+=`<div style="margin-bottom:16px">`;
    // Q1 + EL row
    h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">${matchCard(PL[0])}${matchCard(PL[1])}</div>`;
    // Connector
    h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px;margin-bottom:10px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
        <div style="width:1.5px;height:16px;background:linear-gradient(180deg,rgba(139,92,246,.5),transparent)"></div>
        <div style="font-size:8px;color:rgba(139,92,246,.7);font-weight:800;letter-spacing:.5px;background:rgba(139,92,246,.1);padding:2px 8px;border-radius:999px;border:1px solid rgba(139,92,246,.2)">Q1 Loser →</div>
        <div style="width:1.5px;height:16px;background:linear-gradient(180deg,transparent,rgba(245,158,11,.4))"></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
        <div style="width:1.5px;height:16px;background:linear-gradient(180deg,rgba(6,182,212,.5),transparent)"></div>
        <div style="font-size:8px;color:rgba(6,182,212,.7);font-weight:800;letter-spacing:.5px;background:rgba(6,182,212,.1);padding:2px 8px;border-radius:999px;border:1px solid rgba(6,182,212,.2)">→ EL Winner</div>
        <div style="width:1.5px;height:16px;background:linear-gradient(180deg,transparent,rgba(245,158,11,.4))"></div>
      </div>
    </div>`;
    // Q2
    h+=`<div style="margin-bottom:10px">${matchCard(PL[2])}</div>`;
    // Connector to Final
    h+=`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:10px;padding:0 30px">
      <div style="width:1.5px;height:14px;background:linear-gradient(180deg,rgba(245,158,11,.5),transparent)"></div>
      <div style="font-size:9px;color:rgba(220,38,38,.8);font-weight:900;letter-spacing:1px;background:rgba(220,38,38,.1);padding:3px 12px;border-radius:999px;border:1px solid rgba(220,38,38,.3)">⬇ THE FINAL ⬇</div>
      <div style="width:1.5px;height:14px;background:linear-gradient(180deg,transparent,rgba(220,38,38,.5))"></div>
    </div>`;
    // Final
    h+=matchCard(PL[3],"lg");
    h+=`</div>`;

    // ── FANTASY LEADERBOARD ────────────────────────────────────────
    h+=`<div style="background:linear-gradient(135deg,rgba(15,10,40,.96),rgba(8,5,25,.98));border-radius:22px;padding:20px;margin-bottom:12px;border:1px solid rgba(255,255,255,.06);box-shadow:0 16px 40px rgba(0,0,0,.4)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
        <div>
          <div style="font-size:9px;color:rgba(250,204,21,.7);font-weight:800;letter-spacing:2px;margin-bottom:3px">FANTASY STANDINGS</div>
          <div style="font-size:18px;font-weight:900;color:#fff">Playoffs Only</div>
        </div>
        <div style="background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.2);padding:6px 12px;border-radius:999px;font-size:10px;font-weight:800;color:rgba(250,204,21,.8)">${plDone.length}/4 matches</div>
      </div>`;

    if(plDone.length===0){
      h+=`<div style="text-align:center;padding:30px 0">
        <div style="font-size:36px;margin-bottom:10px">🏏</div>
        <div style="font-size:13px;font-weight:800;color:rgba(255,255,255,.4)">Waiting for playoff action...</div>
        <div style="font-size:11px;color:rgba(255,255,255,.2);margin-top:6px;font-weight:600">Drop scorecards as matches finish</div>
      </div>`;
    } else {
      plSorted.forEach(([mgr,tot],i)=>{
        const mc=M[mgr];
        const pct=plMax>0?(tot/plMax)*100:0;
        h+=`<div style="margin-bottom:14px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:28px;height:28px;border-radius:9px;background:${mc.g};display:grid;place-items:center;font-size:11px;color:#fff;font-weight:900;flex-shrink:0">${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</div>
              <div>
                <div style="font-size:12px;font-weight:800;color:#fff">${mc.e} ${mgr.split(" ")[0]}</div>
                <div style="font-size:9px;color:rgba(255,255,255,.35);font-weight:700">${mc.tag}</div>
              </div>
            </div>
            <div style="font-size:22px;font-weight:900;color:${mc.c}">${tot}</div>
          </div>
          <div style="height:6px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${mc.g};border-radius:999px;transition:width 1s cubic-bezier(.22,1,.36,1)"></div>
          </div>
        </div>`;
      });
    }
    h+=`</div>`;

    // ── PER-MATCH BREAKDOWN ────────────────────────────────────────
    if(plDone.length>0){
      h+=`<div style="font-size:9px;color:rgba(255,255,255,.3);font-weight:800;letter-spacing:2px;margin-bottom:10px;padding:0 4px">MATCH BREAKDOWNS</div>`;
      plDone.forEach(m=>{
        const mp=plPts(m);
        const mSorted=Object.entries(mp).sort((a,b)=>b[1].tot-a[1].tot);
        const matchTop=mSorted[0];
        const labelMap={q1:"Qualifier 1",el:"Eliminator",q2:"Qualifier 2",fn:"Grand Final"};
        h+=`<div style="background:linear-gradient(135deg,rgba(18,12,45,.95),rgba(10,7,28,.98));border-radius:18px;border:1px solid rgba(255,255,255,.06);padding:16px;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.3)">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <div>
              <div style="font-size:13px;font-weight:900;color:#fff">${tb(m.t1)} <span style="color:rgba(255,255,255,.2);font-size:10px;font-weight:600">vs</span> ${tb(m.t2)}</div>
              <div style="font-size:9px;color:rgba(255,255,255,.3);font-weight:700;margin-top:2px">${labelMap[m.cls]||m.label} · ${m.dt}</div>
            </div>
            ${matchTop?`<div style="text-align:right"><div style="font-size:9px;color:rgba(255,255,255,.3);font-weight:700">Top scorer</div><div style="font-size:11px;font-weight:800;color:${M[matchTop[0]]?.c||"#fff"}">${matchTop[0].split(" ")[0]} · ${matchTop[1].tot}pts</div></div>`:""}
          </div>`;
        mSorted.forEach(([mgr,d])=>{
          const mc=M[mgr];
          const topPl=d.pls.sort((a,b)=>b.pt-a.pt)[0];
          h+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid rgba(255,255,255,.05)">
            <div style="display:flex;align-items:center;gap:7px">
              <div style="width:24px;height:24px;border-radius:8px;background:${mc.g};display:grid;place-items:center;font-size:10px;flex-shrink:0">${mc.e}</div>
              <div>
                <div style="font-size:11px;font-weight:800;color:${mc.c}">${mgr.split(" ")[0]}</div>
                ${topPl?`<div style="font-size:9px;color:rgba(255,255,255,.3);font-weight:700">★ ${topPl.n.split(" ").pop()} ${pb(topPl)}</div>`:""}
              </div>
            </div>
            <div style="font-size:18px;font-weight:900;color:${mc.c}">${d.tot}</div>
          </div>`;
          d.pls.sort((a,b)=>b.pt-a.pt).forEach((p,pi)=>{
            h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0 4px 32px;border-top:1px solid rgba(255,255,255,.03)">
              <div style="font-size:10px;color:rgba(255,255,255,.4);font-weight:600">${re(p.rl)} <span style="color:rgba(255,255,255,.6)">${esc(p.n)}</span> <span style="color:${TC[p.t]||"#888"};font-size:8px">${p.t}</span></div>
              <div style="font-size:10px;font-weight:800;color:${mc.c}">${pb(p)} = ${p.pt}</div>
            </div>`;
          });
        });
        h+=`</div>`;
      });
    }
  }
  document.getElementById("app").innerHTML=h;
  let nav=document.getElementById("bnav");if(!nav){nav=document.createElement("div");nav.id="bnav";nav.className="bnav";document.body.appendChild(nav)}nav.innerHTML=NAVTABS.map(([k,ic,label])=>`<div class="bnav-item ${st.tab===k?"on":""}" onclick="st.tab='${k}';render()"><span class="bi">${ic}</span>${label}</div>`).join("")}
render();
</script>
</body>
</html>
