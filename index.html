<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',system-ui,sans-serif;background:#f0f2f8;color:#1a1a2e;min-height:100vh;overflow-x:hidden;padding-bottom:72px}
.w{max-width:640px;margin:0 auto;padding:12px 14px 20px;position:relative}
@media(min-width:768px){.w{max-width:1100px;padding:16px 24px 24px}}

/* Cards */
.cd{background:#fff;border-radius:20px;padding:16px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:all .25s;border:1.5px solid transparent}
.cd:hover{box-shadow:0 4px 20px rgba(0,0,0,.1)}
.cd-hero{background:linear-gradient(135deg,#1a1a2e,#2d1b69);border-radius:24px;padding:20px;margin-bottom:12px;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(26,26,46,.25)}
.cd-hero::before{content:'';position:absolute;top:-50%;right:-30%;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 70%);border-radius:50%}
.cd-hero::after{content:'';position:absolute;bottom:-30%;left:-20%;width:160px;height:160px;background:radial-gradient(circle,rgba(139,92,246,.15) 0%,transparent 70%);border-radius:50%}

/* Bottom Nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8e8f0;display:flex;z-index:100;padding:4px 0 env(safe-area-inset-bottom,4px);box-shadow:0 -2px 20px rgba(0,0,0,.06)}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px 4px;cursor:pointer;font-weight:700;font-size:9px;color:#9ca3af;transition:all .2s;user-select:none;position:relative}
.bnav-item .bi{font-size:18px;line-height:1;transition:transform .2s}
.bnav-item.on{color:#6c3ce0}
.bnav-item.on .bi{transform:scale(1.15)}
.bnav-item.on::before{content:'';position:absolute;top:-1px;left:25%;right:25%;height:3px;background:linear-gradient(90deg,#6c3ce0,#a855f7);border-radius:0 0 4px 4px}

/* Progress bar */
.bar{height:6px;background:#f0f2f8;border-radius:6px;margin-top:10px;overflow:hidden}
.bar div{height:100%;border-radius:6px;transition:width .8s cubic-bezier(.22,1,.36,1)}

/* Animations */
.ri{animation:ri .45s cubic-bezier(.22,1,.36,1) both}
@keyframes ri{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.float{animation:float 3s ease-in-out infinite}

.dh{background:linear-gradient(90deg,#fce7f3,#fff);border-left:3px solid #ec4899;padding:6px 12px;border-radius:0 12px 12px 0;font-size:10px;font-weight:800;color:#ec4899;margin-bottom:8px;letter-spacing:.5px}
.header-title{font-size:28px;font-weight:900;background:linear-gradient(135deg,#6c3ce0,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pts-label{font-size:8px;color:#9ca3af;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.section-title{font-size:10px;font-weight:800;color:#9ca3af;letter-spacing:1.5px;margin-bottom:8px;text-transform:uppercase}
.badge{padding:4px 10px;border-radius:20px;font-weight:700;font-size:9px;letter-spacing:.3px;display:inline-block}
.grid-header{display:grid;font-size:9px;font-weight:700;color:#9ca3af;padding-bottom:8px;border-bottom:1.5px solid #f0f2f8;letter-spacing:.5px;margin-bottom:2px}
.grid-row{display:grid;padding:8px 0;border-bottom:1px solid #f8f8fc;align-items:center}

/* Nav arrow buttons */
.nav-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s;border:none;cursor:pointer}
.nav-btn-on{background:#f0f2f8;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.nav-btn-on:active{background:#e4e6ee;transform:scale(.95)}
.nav-btn-off{background:#f8f8fc;cursor:default}

.avatar-lg{width:80px;height:80px;border-radius:20px;flex-shrink:0;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.avatar-lg svg{width:100%;height:100%;display:block}
.avatar-sm{width:44px;height:44px;border-radius:13px;flex-shrink:0;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.avatar-sm svg{width:100%;height:100%;display:block}
.avatar-sq{width:48px;height:48px;border-radius:14px;flex-shrink:0;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.avatar-sq svg{width:100%;height:100%;display:block}

/* Stat chips */
.stat-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#f8f8fc}

@media(max-width:380px){.header-title{font-size:24px}.avatar-lg{width:68px;height:68px;border-radius:16px}}
@media(min-width:768px){.desk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
</style>
</head>

function calc(){
  let mg={},ps={};
  Object.keys(M).forEach(k=>{mg[k]={r:0,w:0,c:0,ro:0,tot:0,pl:{}}});
  Object.entries(R).forEach(([p,i])=>{ps[p]={n:p,r:0,w:0,c:0,ro:0,pt:0,mg:i.m,rl:i.r,t:i.t}});
  MA.forEach(match=>{
    Object.entries(R).forEach(([p,i])=>{
      let r=match.b?.[p]||0,w=match.w?.[p]||0,c=match.ct?.[p]||0,ro=match.ro?.[p]||0;
      if(r>0||w>0||c>0||ro>0){let pt=r*P.r+w*P.w+c*P.c+ro*P.ro;
      mg[i.m].r+=r;mg[i.m].w+=w;mg[i.m].c+=c;mg[i.m].ro+=ro;mg[i.m].tot+=pt;
      if(!mg[i.m].pl[p])mg[i.m].pl[p]={n:p,r:0,w:0,c:0,ro:0,pt:0,t:i.t,matches:0};
      mg[i.m].pl[p].r+=r;mg[i.m].pl[p].w+=w;mg[i.m].pl[p].c+=c;mg[i.m].pl[p].ro+=ro;mg[i.m].pl[p].pt+=pt;mg[i.m].pl[p].matches++;
      ps[p].r+=r;ps[p].w+=w;ps[p].c+=c;ps[p].ro+=ro;ps[p].pt+=pt}
    });
  });
  Object.keys(mg).forEach(k=>{mg[k].pl=Object.values(mg[k].pl).sort((a,b)=>b.pt-a.pt)});
  return{mg,so:Object.entries(mg).sort((a,b)=>b[1].tot-a[1].tot),tp:Object.values(ps).filter(x=>x.pt>0).sort((a,b)=>b.pt-a.pt).slice(0,20),ps};
}
function pb(p){let s=[];if(p.r>0)s.push(p.r+"R");if(p.w>0)s.push(p.w+"W");if(p.c>0)s.push(p.c+"C");if(p.ro>0)s.push(p.ro+"RO");return s.join(" · ")}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}

        <div><div style="display:flex;align-items:center;gap:3px"><span style="font-size:9px">${re(p.rl)}</span><span style="font-weight:700;font-size:11px;color:${p.pt>0?"#1a1a2e":"#ccc"}">${esc(p.n)}</span></div>
        <div style="font-size:8px;color:#bbb;margin-left:16px">${tb(p.t)}</div></div>
        <div style="text-align:center;color:${p.r>0?"#1a1a2e":"#ddd"};font-weight:700;font-size:10px">${p.r||"-"}</div>
        <div style="text-align:center;color:${p.w>0?"#22c55e":"#ddd"};font-weight:700;font-size:10px">${p.w||"-"}</div>
        <div style="text-align:center;color:${p.c>0?"#6c3ce0":"#ddd"};font-weight:700;font-size:10px">${p.c||"-"}</div>
        <div style="text-align:right;font-weight:900;font-size:12px;color:${p.pt>0?tc.c:"#ddd"}">${p.pt||"0"}</div>
      </div>`;
    });
    h+=`</div>`;
  }

  // === HIGHLIGHTS ===
  if(st.tab==="highlights"){
    if(MA.length===0){h+=`<div class="cd" style="text-align:center;padding:30px"><div style="font-size:28px;margin-bottom:8px">📭</div><div style="font-size:14px;font-weight:800;color:#6c3ce0">No matches played yet</div></div>`;
    } else {
    if(st.selM>=MA.length)st.selM=MA.length-1;
    const match=MA[st.selM];
    h+=`<div class="cd" style="padding:14px 16px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div onclick="if(st.selM>0){st.selM--;render()}" class="nav-btn ${st.selM>0?"nav-btn-on":"nav-btn-off"}">
          <span style="color:${st.selM>0?"#6c3ce0":"#ddd"};font-size:18px;font-weight:900">‹</span>
        </div>
        <div style="text-align:center;flex:1">
          <div style="font-size:9px;color:#a855f7;font-weight:800;letter-spacing:2px;margin-bottom:4px">🎯 MATCH HIGHLIGHTS</div>
          <div style="font-size:18px;font-weight:900">${tb(match.t1)} <span style="color:#ccc;font-size:11px;margin:0 3px">vs</span> ${tb(match.t2)}</div>
          <div style="font-size:10px;color:#9ca3af;margin-top:4px;font-weight:600">Match ${st.selM+1} of ${MA.length} · ${match.dt}</div>
        </div>
        <div onclick="if(st.selM<${MA.length-1}){st.selM++;render()}" class="nav-btn ${st.selM<MA.length-1?"nav-btn-on":"nav-btn-off"}">
          <span style="color:${st.selM<MA.length-1?"#6c3ce0":"#ddd"};font-size:18px;font-weight:900">›</span>
        </div>
      </div>
    </div>`;
    h+=`<div class="cd" style="text-align:center;padding:8px 14px;background:#ecfdf5"><div style="font-size:12px;font-weight:800;color:#16a34a">✅ ${match.rs}</div></div>`;
    const mgrPts={};
    Object.entries(R).forEach(([p,i])=>{let r=match.b?.[p]||0,w=match.w?.[p]||0,c=match.ct?.[p]||0,ro=match.ro?.[p]||0;if(r>0||w>0||c>0||ro>0){let pt=r*P.r+w*P.w+c*P.c+ro*P.ro;if(!mgrPts[i.m])mgrPts[i.m]={tot:0,pls:[]};mgrPts[i.m].tot+=pt;mgrPts[i.m].pls.push({n:p,r,w,c,ro,pt,t:i.t,rl:i.r})}});
    const mgrSorted=Object.entries(mgrPts).sort((a,b)=>b[1].tot-a[1].tot);
    mgrSorted.forEach(([mgr,data],mi)=>{
      const mc=M[mgr];
      h+=`<div class="cd ri" style="animation-delay:${mi*.06}s;border-color:${mi===0?mc.c+"30":"transparent"};background:${mi===0?mc.bg:"#fff"}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:30px;height:30px;border-radius:10px;background:${mc.g};display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:800;flex-shrink:0">${mi===0?"🏆":mi+1}</div>
            <div><div style="font-size:13px;font-weight:800">${mc.e} ${mgr}</div><div style="font-size:9px;color:#9ca3af;font-weight:600">${mc.tag} · ${data.pls.length} scorers</div></div>
          </div>
          <div style="font-size:24px;font-weight:900;color:${mc.c}">${data.tot}<span style="font-size:8px;color:#9ca3af;margin-left:2px">PTS</span></div>
        </div>`;
      data.pls.sort((a,b)=>b.pt-a.pt).forEach((p,j)=>{
        h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid #f8f8fc">
          <div style="display:flex;align-items:center;gap:6px"><span style="font-size:9px">${re(p.rl)}</span><span style="font-weight:700;font-size:11px">${esc(p.n)}</span><span style="font-size:8px;color:#bbb">${tb(p.t)}</span></div>
          <div style="font-weight:800;color:${mc.c};font-size:11px">${pb(p)} = ${p.pt}</div>
        </div>`;
      });
      h+=`</div>`;
    });
    }
  }

  // === PLAYERS ===
  if(st.tab==="players"){
    h+=`<div class="cd">`;
    tp.forEach((p,i)=>{
      const mc=M[p.mg];
      h+=`<div class="ri" style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;${i<tp.length-1?"border-bottom:1px solid #f8f8fc":""};animation-delay:${i*.03}s">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-weight:900;font-size:14px;width:26px;text-align:center;color:${i<3?"#6c3ce0":"#ccc"}">${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</span>
          <div>
            <div style="font-size:12px;font-weight:700">${re(p.rl)} ${esc(p.n)}</div>
            <div style="font-size:9px;color:#9ca3af;margin-top:1px;font-weight:600">${tb(p.t)} · <span style="color:${mc?.c}">${mc?.e} ${p.mg.split(" ")[0]}</span></div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:900;font-size:18px;color:${mc?.c}">${p.pt}</div>
          <div style="font-size:8px;color:#bbb;font-weight:600">${pb(p)}</div>
        </div>
      </div>`;
    });
    h+=`</div>`;
  }

  // === PREVIEW ===
  if(st.tab==="next"){
    const upcoming=getUpcoming();
    if(upcoming.length===0){h+=`<div class="cd" style="text-align:center;padding:30px"><div style="font-size:28px;margin-bottom:8px">🏆</div><div style="font-size:14px;font-weight:800;color:#6c3ce0">All matches completed!</div></div>`;
    } else {
      const grouped=groupByDate(upcoming);const dates=Object.keys(grouped);
      if(st.prevDay>=dates.length)st.prevDay=dates.length-1;
      const dt=dates[st.prevDay],dayMatches=grouped[dt],isDH=dayMatches.length>1;
      h+=`<div class="cd" style="padding:14px 16px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div onclick="if(st.prevDay>0){st.prevDay--;render()}" class="nav-btn ${st.prevDay>0?"nav-btn-on":"nav-btn-off"}">
            <span style="color:${st.prevDay>0?"#6c3ce0":"#ddd"};font-size:18px;font-weight:900">‹</span>
          </div>
          <div style="text-align:center">
            <div style="font-size:9px;color:#a855f7;font-weight:800;letter-spacing:2px;margin-bottom:4px">🔮 MATCH DAY PREVIEW</div>
            <div style="font-size:18px;font-weight:900">${dt}</div>
            <div style="font-size:10px;color:#9ca3af;margin-top:3px;font-weight:600">${isDH?"🔥 Double Header":"Single Match"} · Day ${st.prevDay+1} of ${dates.length}</div>
          </div>
          <div onclick="if(st.prevDay<${dates.length-1}){st.prevDay++;render()}" class="nav-btn ${st.prevDay<dates.length-1?"nav-btn-on":"nav-btn-off"}">
            <span style="color:${st.prevDay<dates.length-1?"#6c3ce0":"#ddd"};font-size:18px;font-weight:900">›</span>
          </div>
        </div>
      </div>`;
      if(isDH)h+=`<div class="dh">🔥 DOUBLE HEADER · ${dt}</div>`;
      dayMatches.forEach((m,mi)=>{
        h+=`<div class="cd ri" style="animation-delay:${mi*.06}s;${isDH?"border-left:3px solid #ec4899":""}">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div><div style="font-size:16px;font-weight:900">${tb(m.t1)} <span style="color:#ccc;font-size:11px;margin:0 4px">vs</span> ${tb(m.t2)}</div>
            <div style="font-size:10px;color:#9ca3af;margin-top:4px;font-weight:600">Match #${m.n} · ${m.v}</div></div>
            <span class="badge" style="background:#eef6ff;color:#2d7dd2;font-size:9px">Upcoming</span>
          </div>
        </div>`;
      });
      const allTeams=[];dayMatches.forEach(m=>{allTeams.push(m.t1);allTeams.push(m.t2)});
      const mgrPlayers={};Object.keys(M).forEach(mgr=>{mgrPlayers[mgr]=[]});
      allTeams.forEach(t=>{Object.entries(R).filter(([_,i])=>i.t===t).forEach(([n,i])=>{mgrPlayers[i.m].push({n,r:i.r,t})})});
      const activeMgrs=Object.entries(mgrPlayers).filter(([_,pls])=>pls.length>0).sort((a,b)=>b[1].length-a[1].length);
      if(activeMgrs.length>0){
        h+=`<div class="cd ri" style="animation-delay:.12s">
          <div class="section-title">${isDH?"🔥 Fantasy Players — Both Matches":"⚡ Fantasy Players In Action"}</div>`;
        activeMgrs.forEach(([mgr,pls])=>{
          const mc=M[mgr];
          h+=`<div style="margin-bottom:10px"><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
            <span style="font-size:11px">${mc.e}</span><span style="font-weight:800;font-size:11px;color:${mc.c}">${mgr}</span>
            <span style="font-size:9px;color:#9ca3af;font-weight:700">${mc.tag} · ${pls.length} in action</span></div>`;
          pls.forEach((p,pi)=>{
            h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:${pi<pls.length-1?"1px solid #f8f8fc":"none"}">
              <div style="display:flex;align-items:center;gap:5px"><span style="font-size:9px">${re(p.r)}</span><span style="font-weight:600;font-size:11px">${esc(p.n)}</span></div>
              <span style="color:${TC[p.t]};font-weight:700;font-size:9px">${p.t}</span>
            </div>`;
          });
          h+=`</div>`;
        });
        h+=`</div>`;
      }
    }
  }

  // === TABLE ===
  if(st.tab==="table"){
    h+=`<div class="cd">
      <div style="font-size:16px;font-weight:800;color:#1a1a2e;margin-bottom:12px">📊 IPL 2026 Standings</div>`;
    h+=`<div class="grid-header" style="grid-template-columns:24px 1fr 28px 28px 28px 50px 36px"><div>#</div><div>TEAM</div><div style="text-align:center">M</div><div style="text-align:center">W</div><div style="text-align:center">L</div><div style="text-align:right">NRR</div><div style="text-align:right">PTS</div></div>`;
    PT.forEach((t,i)=>{
      h+=`<div class="ri grid-row" style="grid-template-columns:24px 1fr 28px 28px 28px 50px 36px;animation-delay:${i*.03}s;${i<4?"background:#f8f8fc;border-radius:8px;margin:2px 0":""}">
        <div style="font-weight:800;font-size:11px;color:${i<4?"#6c3ce0":"#ccc"}">${i+1}</div>
        <div style="font-weight:800;font-size:12px;color:${TC[t.t]}">${t.t}</div>
        <div style="text-align:center;color:#888;font-weight:700;font-size:10px">${t.m}</div>
        <div style="text-align:center;color:#22c55e;font-weight:700;font-size:10px">${t.w||"-"}</div>
        <div style="text-align:center;color:${t.l>0?"#ef4444":"#eee"};font-weight:700;font-size:10px">${t.l||"-"}</div>
        <div style="text-align:right;color:${parseFloat(t.nrr)>0?"#22c55e":parseFloat(t.nrr)<0?"#ef4444":"#999"};font-weight:700;font-size:9px">${t.nrr}</div>
        <div style="text-align:right;font-weight:900;font-size:13px;color:${t.pts>0?"#6c3ce0":"#ddd"}">${t.pts}</div>
      </div>`;
    });
    h+=`<div style="margin-top:10px;padding-top:8px;border-top:1.5px solid #f0f2f8;font-size:9px;color:#bbb;font-weight:600">Top 4 qualify for playoffs · 2pts per win</div></div>`;
  }

  // === SCHEDULE ===
  if(st.tab==="schedule"){
    h+=`<div style="font-size:16px;font-weight:800;color:#1a1a2e;margin-bottom:12px">📅 IPL 2026 Schedule</div>`;
    let prevDt="";
    SCH.forEach((s,i)=>{
      if(s.dh&&s.dt!==prevDt){h+=`<div class="dh">🔥 DOUBLE HEADER · ${s.dt}</div>`}
      prevDt=s.dt;
      h+=`<div class="cd ri" style="padding:10px 14px;animation-delay:${i*.02}s;${s.done?"opacity:.45":""}">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div>
            <div style="font-size:12px;font-weight:800">${tb(s.t1)} <span style="color:#ccc;font-size:9px">vs</span> ${tb(s.t2)}</div>
            <div style="font-size:9px;color:#bbb;margin-top:3px;font-weight:600">#${s.n} · ${s.dt} · ${s.v}</div>
          </div>
          <div>${s.done?`<span class="badge" style="background:#ecfdf5;color:#16a34a">✓ Done</span>`:`<span class="badge" style="background:#eef6ff;color:#2d7dd2">Upcoming</span>`}</div>
        </div>
      </div>`;
    });
  }

  h+=`<div style="text-align:center;margin-top:16px;padding:12px 0">
    <div style="font-size:9px;color:#bbb;font-weight:700;letter-spacing:1.5px">FANTASY IPL 2026 · 5 MANAGERS · 75 PLAYERS · ${MA.length} MATCHES</div>
  </div>`;

  document.getElementById("app").innerHTML=h;

  // Bottom Nav
  let nav=document.getElementById("bnav");
  if(!nav){nav=document.createElement("div");nav.id="bnav";nav.className="bnav";document.body.appendChild(nav)}
  nav.innerHTML=NAVTABS.map(([k,ic,label])=>`<div class="bnav-item ${st.tab===k?"on":""}" onclick="st.tab='${k}';render()"><span class="bi">${ic}</span>${label}</div>`).join("");
}
render();
</script>
</body>
</html>
