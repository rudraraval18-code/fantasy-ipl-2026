<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Fantasy IPL 2026</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#050510;color:#e8e8f0;min-height:100vh;overflow-x:hidden}
.w{max-width:640px;margin:0 auto;padding:16px 16px 50px}
.cd{background:#0c0c20;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid #1a1a3e;backdrop-filter:blur(10px);box-shadow:0 4px 24px rgba(0,0,0,.4);transition:border-color .3s,box-shadow .3s}
.cd:hover{border-color:#2a2a5e}
.tab-bar{display:flex;gap:4px;margin-bottom:16px;position:sticky;top:0;z-index:10;background:#050510;padding:8px 0 6px}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border-radius:10px;cursor:pointer;font-weight:700;font-size:9px;text-align:center;background:#0c0c20;color:#555;border:1px solid #1a1a3e;transition:all .25s;letter-spacing:.3px;user-select:none}
.tab-btn .tab-icon{font-size:14px;line-height:1}
.tab-btn.on{background:#FF004D11;color:#FF004D;border-color:#FF004D55;box-shadow:0 0 16px #FF004D15}
.bar{height:6px;background:#111;border-radius:6px;margin-top:10px;overflow:hidden}
.bar div{height:100%;border-radius:6px;transition:width .8s cubic-bezier(.22,1,.36,1)}
.ri{animation:ri .45s cubic-bezier(.22,1,.36,1) both}
@keyframes ri{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes glow{0%,100%{text-shadow:0 0 8px var(--gc)}50%{text-shadow:0 0 20px var(--gc),0 0 40px var(--gc)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes orb{0%{transform:translate(0,0) scale(1)}25%{transform:translate(30px,-20px) scale(1.1)}50%{transform:translate(-10px,15px) scale(.95)}75%{transform:translate(-25px,-10px) scale(1.05)}100%{transform:translate(0,0) scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes crownBob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
@keyframes borderGlow{0%,100%{border-color:var(--bg1)}50%{border-color:var(--bg2)}}
.ld{display:inline-block;width:7px;height:7px;border-radius:50%;background:#FF004D;animation:pulse 1.5s infinite;margin-right:5px;vertical-align:middle}
.gl{animation:glow 2.5s ease-in-out infinite}
.dh{background:linear-gradient(90deg,#FF004D22,transparent);border-left:3px solid #FF004D;padding:5px 12px;border-radius:0 8px 8px 0;font-size:10px;font-weight:800;color:#FF004D;margin-bottom:8px;letter-spacing:1px}
.header-title{font-size:28px;font-weight:900;background:linear-gradient(135deg,#FF004D,#FF6600,#A855F7,#3B82F6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pts-label{font-size:9px;color:#555;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.grid-header{display:grid;font-size:9px;font-weight:700;color:#555;padding-bottom:8px;border-bottom:1px solid #1a1a3e;letter-spacing:.5px;margin-bottom:2px}
.grid-row{display:grid;padding:9px 0;border-bottom:1px solid #111;align-items:center}
.section-title{font-size:10px;font-weight:800;color:#555;letter-spacing:1.5px;margin-bottom:8px;text-transform:uppercase}
.badge{padding:4px 10px;border-radius:6px;font-weight:800;font-size:10px;letter-spacing:.5px;display:inline-block}
.score-chip{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;border-radius:12px;border:1px solid #1a1a3e;transition:all .25s;background:rgba(255,255,255,.02)}
.score-chip:hover{border-color:#2a2a5e;transform:translateX(2px)}
.float{animation:float 3s ease-in-out infinite}
.leader-card{position:relative;overflow:hidden;border-radius:24px;padding:0;margin-bottom:16px;border:2px solid;animation:borderGlow 3s ease-in-out infinite}
.leader-inner{position:relative;z-index:2;padding:26px 22px 22px}
.leader-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.leader-bg .orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.15;animation:orb 8s ease-in-out infinite}
.leader-shimmer{position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--bg2),transparent);background-size:200% 100%;animation:shimmer 3s linear infinite}
.avatar-lg{width:100px;height:100px;border-radius:24px;flex-shrink:0;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.avatar-lg svg{width:100%;height:100%;display:block}
.avatar-sm{width:52px;height:52px;border-radius:14px;flex-shrink:0;overflow:hidden}
.avatar-sm svg{width:100%;height:100%;display:block}
.avatar-sq{width:54px;height:54px;border-radius:14px;flex-shrink:0;overflow:hidden}
.avatar-sq svg{width:100%;height:100%;display:block}
@media(max-width:380px){.tab-btn{font-size:8px;padding:6px 1px 5px}.header-title{font-size:24px}.avatar-lg{width:80px;height:80px;border-radius:18px}}
</style>
</head>

function calc(){
  let mg={},ps={};
  Object.keys(M).forEach(k=>{mg[k]={r:0,w:0,c:0,ro:0,tot:0,pl:[]}});
  Object.entries(R).forEach(([p,i])=>{ps[p]={n:p,r:0,w:0,c:0,ro:0,pt:0,mg:i.m,rl:i.r,t:i.t}});
  MA.forEach(match=>{
    Object.entries(R).forEach(([p,i])=>{
      let r=match.b?.[p]||0,w=match.w?.[p]||0,c=match.ct?.[p]||0,ro=match.ro?.[p]||0;
      if(r>0||w>0||c>0||ro>0){let pt=r*P.r+w*P.w+c*P.c+ro*P.ro;
      mg[i.m].r+=r;mg[i.m].w+=w;mg[i.m].c+=c;mg[i.m].ro+=ro;mg[i.m].tot+=pt;
      mg[i.m].pl.push({n:p,r,w,c,ro,pt,t:i.t,mt:match.ti});
      ps[p].r+=r;ps[p].w+=w;ps[p].c+=c;ps[p].ro+=ro;ps[p].pt+=pt}
    });
  });
  return{mg,so:Object.entries(mg).sort((a,b)=>b[1].tot-a[1].tot),tp:Object.values(ps).filter(x=>x.pt>0).sort((a,b)=>b.pt-a.pt).slice(0,20),ps};
}

function pb(p){let s=[];if(p.r>0)s.push(p.r+"r");if(p.w>0)s.push(p.w+"w");if(p.c>0)s.push(p.c+"c");if(p.ro>0)s.push(p.ro+"ro");return s.join(" · ")}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function animNum(id,target){const el=document.getElementById(id);if(!el)return;let c=0;const step=Math.max(1,Math.floor(target/30));const iv=setInterval(()=>{c+=step;if(c>=target){c=target;clearInterval(iv)}el.textContent=c},18)}
function getNext(){return SCH.find(s=>!s.done)}
function getPlayersForTeam(t){return Object.entries(R).filter(([_,i])=>i.t===t).map(([n,i])=>({n,m:i.m,r:i.r,mc:M[i.m]}))}

  }

  // === HIGHLIGHTS ===
  if(st.tab==="highlights"){
    h+=`<div style="display:flex;gap:6px;margin-bottom:14px">${MA.map((mt,i)=>`<div onclick="st.selM=${i};render()" style="flex:1;padding:10px 4px;border-radius:10px;cursor:pointer;text-align:center;border:1px solid ${st.selM===i?"#FF660055":"#1a1a3e"};background:${st.selM===i?"#FF660011":"#0c0c20"};transition:all .2s">
      <div style="font-size:12px;font-weight:800;color:${st.selM===i?"#FF6600":"#555"}">${tb(mt.t1)} v ${tb(mt.t2)}</div>
      <div style="font-size:9px;color:#444;margin-top:3px">${mt.dt}</div>
    </div>`).join("")}</div>`;
    const match=MA[st.selM],sc=[];
    Object.entries(R).forEach(([p,i])=>{let r=match.b?.[p]||0,w=match.w?.[p]||0,c=match.ct?.[p]||0,ro=match.ro?.[p]||0;if(r>0||w>0||c>0||ro>0)sc.push({n:p,r,w,c,ro,pt:r*P.r+w*P.w+c*P.c+ro*P.ro,mg:i.m,t:i.t,rl:i.r})});
    sc.sort((a,b)=>b.pt-a.pt);
    h+=`<div class="cd">
      <div style="margin-bottom:14px">
        <div style="font-size:18px;font-weight:800">${tb(match.t1)} <span style="color:#333;font-size:13px">vs</span> ${tb(match.t2)}</div>
        <div style="font-size:11px;color:#555;margin-top:4px">${match.dt} · <span style="color:#FF004D">${match.rs}</span></div>
      </div>`;
    sc.forEach((s,i)=>{
      const mc=M[s.mg];
      h+=`<div class="score-chip ri" style="animation-delay:${i*.05}s;${i===0?`border-color:${mc?.c}33;background:${mc?.c}08`:""};cursor:default">
        <div style="width:30px;height:30px;border-radius:10px;background:${mc?.g};display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:800;flex-shrink:0">${i===0?"⭐":i+1}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700">${re(s.rl)} ${esc(s.n)}</div>
          <div style="font-size:9px;color:#555;margin-top:1px">${tb(s.t)} · ${mc?.e} ${s.mg.split(" ")[0]}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-weight:900;font-size:20px;color:${mc?.c};text-shadow:0 0 8px ${mc?.c}25">${s.pt}</div>
          <div style="font-size:8px;color:#555">${pb(s)}</div>
        </div>
      </div>`;
    });
    h+=`</div>`;
  }

  // === PLAYERS ===
  if(st.tab==="players"){
    h+=`<div class="cd">`;
    tp.forEach((p,i)=>{
      const mc=M[p.mg];
      h+=`<div class="ri" style="display:flex;align-items:center;justify-content:space-between;padding:11px 0;${i<tp.length-1?"border-bottom:1px solid #111":""};animation-delay:${i*.04}s">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-weight:900;font-size:15px;width:28px;text-align:center;color:${i<3?"#FF004D":"#444"}">${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</span>
          <div>
            <div style="font-size:14px;font-weight:700">${re(p.rl)} ${esc(p.n)}</div>
            <div style="font-size:10px;color:#555;margin-top:2px">${tb(p.t)} · <span style="color:${mc?.c}">${mc?.e} ${p.mg.split(" ")[0]}</span></div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:900;font-size:20px;color:${mc?.c};text-shadow:0 0 8px ${mc?.c}25">${p.pt}</div>
          <div style="font-size:8px;color:#555">${pb(p)}</div>
        </div>
      </div>`;
    });
    h+=`</div>`;
  }

  // === NEXT MATCH PREVIEW ===
  if(st.tab==="next"&&next){
    const p1=getPlayersForTeam(next.t1),p2=getPlayersForTeam(next.t2);
    h+=`<div class="cd" style="border-color:#A855F733;text-align:center;padding:22px">
      <div style="font-size:10px;color:#A855F7;font-weight:800;letter-spacing:2px;margin-bottom:10px">🔮 NEXT MATCH PREVIEW</div>
      <div style="font-size:22px;font-weight:900">${tb(next.t1)} <span style="color:#333;font-size:15px;margin:0 8px">vs</span> ${tb(next.t2)}</div>
      <div style="font-size:12px;color:#555;margin-top:8px">Match ${next.n} · ${next.dt} · ${next.v}</div>
    </div>`;
    [["t1",next.t1,p1],["t2",next.t2,p2]].forEach(([k,t,pls])=>{
      if(pls.length===0)return;
      h+=`<div class="cd ri" style="animation-delay:.1s">
        <div style="font-size:14px;font-weight:800;color:${TC[t]};margin-bottom:12px">${tb(t)} — Your Players (${pls.length})</div>`;
      pls.forEach((p,i)=>{
        h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:${i<pls.length-1?"1px solid #111":"none"}">
          <div>${re(p.r)} <span style="font-weight:700;font-size:13px">${esc(p.n)}</span></div>
          <div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;color:#555">${p.r}</span><span style="color:${p.mc.c};font-weight:700;font-size:11px">${p.mc.e} ${p.m.split(" ")[0]}</span></div>
        </div>`;
      });
      h+=`</div>`;
    });
    if(p1.length===0&&p2.length===0)h+=`<div class="cd" style="text-align:center;color:#555;padding:24px">No fantasy players in this match</div>`;
  }

  // === IPL TABLE ===
  if(st.tab==="table"){
    h+=`<div class="cd">
      <div style="font-size:15px;font-weight:800;color:#FF004D;margin-bottom:14px">📊 IPL 2026 Standings</div>`;
    h+=`<div class="grid-header" style="grid-template-columns:28px 1fr 30px 30px 30px 55px 40px"><div>#</div><div>TEAM</div><div style="text-align:center">M</div><div style="text-align:center">W</div><div style="text-align:center">L</div><div style="text-align:right">NRR</div><div style="text-align:right">PTS</div></div>`;
    PT.forEach((t,i)=>{
      const tc=TC[t.t];
      h+=`<div class="ri grid-row" style="grid-template-columns:28px 1fr 30px 30px 30px 55px 40px;animation-delay:${i*.04}s">
        <div style="font-weight:800;font-size:13px;color:${i<4?"#FF004D":"#444"}">${i+1}</div>
        <div style="font-weight:800;font-size:14px;color:${tc}">${t.t}</div>
        <div style="text-align:center;color:#888;font-weight:700;font-size:12px">${t.m}</div>
        <div style="text-align:center;color:#39FF14;font-weight:700;font-size:12px">${t.w||"-"}</div>
        <div style="text-align:center;color:${t.l>0?"#FF004D":"#222"};font-weight:700;font-size:12px">${t.l||"-"}</div>
        <div style="text-align:right;color:${parseFloat(t.nrr)>0?"#39FF14":parseFloat(t.nrr)<0?"#FF004D":"#555"};font-weight:700;font-size:11px">${t.nrr}</div>
        <div style="text-align:right;font-weight:900;font-size:15px;color:${t.pts>0?"#FF004D":"#333"}">${t.pts}</div>
      </div>`;
    });
    h+=`<div style="margin-top:12px;padding-top:8px;border-top:1px solid #1a1a3e;font-size:10px;color:#444">Top 4 qualify for playoffs · 2pts per win · NRR breaks ties</div></div>`;
  }

  // === SCHEDULE ===
  if(st.tab==="schedule"){
    h+=`<div style="font-size:15px;font-weight:800;color:#FF004D;margin-bottom:14px">📅 IPL 2026 Schedule</div>`;
    let prevDt="";
    SCH.forEach((s,i)=>{
      if(s.dh&&s.dt!==prevDt){h+=`<div class="dh">🔥 DOUBLE HEADER · ${s.dt}</div>`}
      prevDt=s.dt;
      h+=`<div class="cd ri" style="padding:12px 14px;animation-delay:${i*.03}s;${s.done?"opacity:.55":""}">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div>
            <div style="font-size:14px;font-weight:800">${tb(s.t1)} <span style="color:#333;font-size:11px">vs</span> ${tb(s.t2)}</div>
            <div style="font-size:10px;color:#555;margin-top:4px">#${s.n} · ${s.dt} · ${s.v}</div>
          </div>
          <div>${s.done?`<span class="badge" style="background:#39FF1415;color:#39FF14">✓ Done</span>`:`<span class="badge" style="background:#3B82F615;color:#3B82F6">Upcoming</span>`}</div>
        </div>
      </div>`;
    });
    h+=`<div style="text-align:center;color:#444;font-size:10px;padding:14px 0">Showing first 20 matches · Full schedule updates coming</div>`;
  }

  h+=`<div style="text-align:center;margin-top:24px;padding:16px 0;border-top:1px solid #1a1a3e">
    <div style="font-size:9px;color:#444;font-weight:700;letter-spacing:1.5px">FANTASY IPL 2026 · 5 MANAGERS · 75 PLAYERS · ${MA.length} MATCHES</div>
  </div>`;

  document.getElementById("app").innerHTML=h;
  animNum("lp",lv.tot);
  if(st.tab==="board")so.forEach(([_,d],i)=>animNum("bp"+i,d.tot));
  if(st.tab==="squads")animNum("sp",mg[st.selT].tot);
}
render();
</script>
</body>
</html>
