<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',system-ui,sans-serif;background:radial-gradient(circle at top right, rgba(168,85,247,.18), transparent 28%),radial-gradient(circle at top left, rgba(236,72,153,.10), transparent 25%),linear-gradient(180deg,#eef2ff 0%,#f7f7fb 45%,#edf1f7 100%);color:#17172b;min-height:100vh;overflow-x:hidden;padding-bottom:92px}
.w{max-width:640px;margin:0 auto;padding:12px 14px 20px;position:relative}
@media(min-width:768px){.w{max-width:1200px;padding:18px 24px 28px}}
.cd{background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-radius:24px;padding:18px;margin-bottom:12px;box-shadow:0 16px 32px rgba(39,44,63,.08);transition:all .25s;border:1px solid rgba(124,58,237,.06)}
.cd:hover{box-shadow:0 22px 38px rgba(39,44,63,.11);transform:translateY(-3px)}
.cd-hero{background:linear-gradient(145deg,#18182d 0%,#251c4f 45%,#321b5f 100%);border-radius:30px;padding:24px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden;box-shadow:0 24px 50px rgba(38,23,77,.22)}
.cd-hero::before{content:'';position:absolute;top:-38%;right:-12%;width:280px;height:280px;background:radial-gradient(circle,rgba(255,255,255,.16) 0%,transparent 65%);border-radius:50%}
.cd-hero::after{content:'';position:absolute;bottom:-38%;left:-12%;width:230px;height:230px;background:radial-gradient(circle,rgba(236,72,153,.18) 0%,transparent 65%);border-radius:50%}
.bnav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(880px,calc(100% - 24px));background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border:1px solid rgba(124,58,237,.08);display:flex;z-index:100;padding:8px;box-shadow:0 20px 42px rgba(40,43,62,.14);border-radius:24px}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;cursor:pointer;font-weight:800;font-size:10px;color:#8b93a7;transition:all .2s;user-select:none;position:relative;border-radius:18px}
.bnav-item .bi{font-size:18px;line-height:1;transition:transform .2s}
.bnav-item.on{color:#fff;background:linear-gradient(135deg,#6d28d9,#a855f7);box-shadow:0 10px 22px rgba(124,58,237,.22)}
.bnav-item.on .bi{transform:scale(1.08)}
.bar{height:10px;background:#edf0f6;border-radius:999px;margin-top:12px;overflow:hidden}
.bar div{height:100%;border-radius:999px;transition:width .8s cubic-bezier(.22,1,.36,1);background:linear-gradient(90deg,#7c3aed,#a855f7 58%,#ec4899 100%)}
.ri{animation:ri .45s cubic-bezier(.22,1,.36,1) both}
@keyframes ri{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.float{animation:float 3s ease-in-out infinite}
.dh{background:linear-gradient(90deg,#fce7f3,#fff);border-left:3px solid #ec4899;padding:6px 12px;border-radius:0 12px 12px 0;font-size:10px;font-weight:800;color:#ec4899;margin-bottom:8px;letter-spacing:.5px}
.header-title{font-size:32px;font-weight:900;background:linear-gradient(135deg,#5b21b6,#7c3aed 45%,#ec4899 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pts-label{font-size:8px;color:#9ca3af;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.section-title{font-size:10px;font-weight:800;color:#9ca3af;letter-spacing:1.5px;margin-bottom:8px;text-transform:uppercase}
.badge{padding:4px 10px;border-radius:20px;font-weight:700;font-size:9px;letter-spacing:.3px;display:inline-block}
.grid-header{display:grid;font-size:9px;font-weight:700;color:#9ca3af;padding-bottom:8px;border-bottom:1.5px solid #f0f2f8;letter-spacing:.5px;margin-bottom:2px}
.grid-row{display:grid;padding:8px 0;border-bottom:1px solid #f8f8fc;align-items:center}
.nav-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s;border:none;cursor:pointer}
.nav-btn-on{background:#f0f2f8;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.nav-btn-on:active{background:#e4e6ee;transform:scale(.95)}
.nav-btn-off{background:#f8f8fc;cursor:default}
.avatar-lg{width:80px;height:80px;border-radius:20px;flex-shrink:0;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.avatar-lg svg{width:100%;height:100%;display:block}
.avatar-sm{width:44px;height:44px;border-radius:13px;flex-shrink:0;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.avatar-sm svg{width:100%;height:100%;display:block}
.avatar-sq{width:48px;height:48px;border-radius:14px;flex-shrink:0;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.avatar-sq svg{width:100%;height:100%;display:block}
.stat-chip{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(255,255,255,.85);border:1px solid rgba(124,58,237,.08);box-shadow:0 8px 24px rgba(34,35,58,.06)}
.hero-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;position:relative;z-index:1}.hero-mini{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px}.hero-mini .label{color:rgba(255,255,255,.58);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin-bottom:8px}.hero-mini .value{font-size:24px;font-weight:900}.topstrip{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.match-pill{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid rgba(124,58,237,.08);box-shadow:0 8px 24px rgba(34,35,58,.06);font-size:12px;font-weight:800;color:#4b5563}.board-wrap{display:grid;grid-template-columns:1.25fr .95fr;gap:14px}.board-side .cd{position:sticky;top:12px}.preview-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.next-hero{display:grid;gap:14px}.mini-list{display:grid;gap:10px}.mini-row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #f1f3f8}.mini-row:first-child{border-top:0;padding-top:0}
@media(max-width:920px){.board-wrap,.preview-grid{grid-template-columns:1fr}.board-side .cd{position:static}}
@media(max-width:640px){body{padding-bottom:116px}.hero-mini-grid{grid-template-columns:1fr}.bnav{bottom:12px;width:calc(100% - 16px);border-radius:22px;flex-wrap:wrap}.bnav-item{min-width:25%}.topstrip{align-items:flex-start}.header-title{font-size:28px}.avatar-lg{width:72px;height:72px;border-radius:18px}.preview-grid{gap:10px}}
@media(max-width:380px){.header-title{font-size:24px}.avatar-lg{width:68px;height:68px;border-radius:16px}}
</style>

  let h=`<div style="padding:10px 0 12px"><div class="topstrip"><div><div class="header-title float">🏏 Fantasy IPL 2026</div><div style="font-size:12px;color:#6b7280;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:4px">Responsive redesign · latest data</div></div><div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:11px;color:#9ca3af;font-weight:600"><span class="stat-chip">🏏 Run = 1</span><span class="stat-chip">🎯 Wicket = 25</span><span class="stat-chip">🧤 Catch / Stumping / RO = 5</span></div></div></div>`;
  h+=`<div class="topstrip" style="margin-bottom:12px"><div class="match-pill"><span style="width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 1.5s infinite"></span>${MA.length} Matches Tracked</div>${next?`<div class="match-pill">Next: ${tb(next.t1)} vs ${tb(next.t2)} · ${next.dt}</div>`:""}</div>`;
  h+=`<div class="cd-hero ri"><div style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.1);color:#f9c74f;padding:8px 12px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;position:relative;z-index:1;margin-bottom:14px">🏆 League Leader</div><div style="display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative;z-index:1;flex-wrap:wrap"><div style="display:flex;align-items:center;gap:18px;flex:1;min-width:240px"><div class="avatar-lg" style="width:88px;height:88px;border-radius:24px;box-shadow:0 12px 26px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.28)">${ROBOTS[ln]}</div><div style="flex:1;min-width:0"><div style="color:#c4b5fd;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px">${lc.tag} · First Place</div><div style="font-size:clamp(26px,4vw,34px);font-weight:900;line-height:1.05;letter-spacing:-.03em">${esc(ln)}</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><span style="background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08);padding:9px 12px;border-radius:14px;font-size:12px;font-weight:800;color:rgba(255,255,255,.92)">🏏 ${lv.r} Runs</span><span style="background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08);padding:9px 12px;border-radius:14px;font-size:12px;font-weight:800;color:rgba(255,255,255,.92)">🎯 ${lv.w} Wickets</span><span style="background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08);padding:9px 12px;border-radius:14px;font-size:12px;font-weight:800;color:rgba(255,255,255,.92)">🧤 ${lv.c+lv.ro} Fielding</span></div></div></div><div style="text-align:right;min-width:150px"><div style="font-size:clamp(48px,8vw,72px);line-height:.95;font-weight:900;color:${lc.c};text-shadow:0 8px 22px rgba(255,93,115,.18)">${lv.tot}</div><div style="margin-top:8px;font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.55);font-weight:800;text-transform:uppercase">Fantasy Points</div></div></div><div class="hero-mini-grid"><div class="hero-mini"><div class="label">Top performer</div><div class="value">${lv.pl[0]?.n || "-"}</div></div><div class="hero-mini"><div class="label">Lead gap</div><div class="value">${so.length>1?`+${lv.tot-so[1][1].tot}`:"0"}</div></div><div class="hero-mini"><div class="label">Matches tracked</div><div class="value">${MA.length}</div></div></div></div>`;

  if(st.tab==="board"){
    const isDesk=window.innerWidth>=768;
    h+=`<div class="board-wrap"><div${isDesk?` class="desk-grid"`:''}>`;
    so.forEach(([n,d],i)=>{const c=M[n],isE=st.exp===n,bw=lv.tot>0?(d.tot/lv.tot)*100:0;h+=`<div class="cd ri" style="cursor:pointer;animation-delay:${i*.06}s;background:${c.bg};border-left:4px solid ${c.c};border-color:${c.c}${isE?"60":"25"}" onclick="st.exp=st.exp==='${esc(n)}'?null:'${esc(n)}';render()"><div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:12px"><div class="avatar-sm">${ROBOTS[n]}</div><div><div style="font-weight:800;font-size:15px;color:#1a1a2e">${c.e} ${esc(n)} ${i===0?'<span style="font-size:8px;background:'+c.c+';color:#fff;padding:2px 8px;border-radius:10px;margin-left:4px;vertical-align:middle">LEADER</span>':''}</div><div style="font-size:10px;color:#9ca3af;margin-top:2px;font-weight:600">${c.tag} · ${d.r}R · ${d.w}W · ${d.c+d.ro}F</div></div></div><div style="text-align:right;flex-shrink:0"><div style="font-size:28px;font-weight:900;color:${c.c}">${d.tot}</div><div class="pts-label">PTS</div></div></div><div class="bar"><div style="width:${bw}%"></div></div>`;if(isE&&d.pl.length>0){h+=`<div style="margin-top:12px;border-top:1.5px solid #f0f2f8;padding-top:10px"><div class="section-title">Scoring Players</div>`;d.pl.forEach((p,j)=>{h+=`<div class="ri" style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:${j<d.pl.length-1?"1px solid #f8f8fc":"none"};animation-delay:${j*.03}s"><div>${re(R[p.n]?.r||"")} <span style="font-weight:700;font-size:12px">${esc(p.n)}</span> <span style="font-size:9px;color:#9ca3af">${tb(p.t)}${p.matches>1?" · "+p.matches+"m":""}</span></div><div style="font-weight:800;color:${c.c};font-size:12px">${pb(p)} = ${p.pt}</div></div>`});h+=`</div>`}h+=`</div>`});
    h+=`</div><div class="board-side"><div class="cd"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px"><div style="font-size:17px;font-weight:900;letter-spacing:-.02em">Top Players</div><div style="font-size:11px;color:#8b5cf6;font-weight:800;letter-spacing:.14em;text-transform:uppercase">Fantasy</div></div>${tp.slice(0,5).map((p,i)=>`<div class="mini-row"><div style="width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:#f3f0ff;color:#7c3aed;font-weight:900;font-size:13px">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div><div><div style="font-size:13px;font-weight:800">${esc(p.n)}</div><div style="color:#9ca3af;font-size:11px;font-weight:700;margin-top:3px">${tb(p.t)} · ${M[p.mg].e} ${p.mg.split(' ')[0]}</div></div><div style="font-size:18px;font-weight:900;color:${M[p.mg].c}">${p.pt}</div></div>`).join('')}</div></div></div>`;
  }

  if(st.tab==="squads"){const tc=M[st.selT];const sqPl=Object.values(ps).filter(p=>p.mg===st.selT).sort((a,b)=>b.pt-a.pt);h+=`<div style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px">${Object.keys(M).map(n=>`<div onclick="st.selT='${esc(n)}';render()" style="min-width:72px;padding:9px 8px;border-radius:16px;cursor:pointer;font-weight:700;font-size:10px;text-align:center;border:2px solid ${st.selT===n?M[n].c:"transparent"};background:${st.selT===n?M[n].bg:"rgba(255,255,255,.88)"};color:${st.selT===n?M[n].c:"#9ca3af"};transition:all .2s;box-shadow:0 8px 24px rgba(34,35,58,.06)">${M[n].e}<br>${n.split(" ")[0]}</div>`).join("")}</div>`;h+=`<div class="cd" style="border-color:${tc.c}20;background:${tc.bg}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:14px;flex-wrap:wrap"><div style="display:flex;align-items:center;gap:12px"><div class="avatar-sq">${ROBOTS[st.selT]}</div><div><div style="font-size:10px;color:${tc.c};font-weight:700;letter-spacing:1.5px;text-transform:uppercase;opacity:.7">${tc.tag}</div><div style="font-size:19px;font-weight:900;color:#1a1a2e">${tc.e} ${esc(st.selT)}</div><div style="font-size:10px;color:#9ca3af;margin-top:2px;font-weight:600">15 players</div></div></div><div style="font-size:30px;font-weight:900;color:${tc.c}">${mg[st.selT].tot}</div></div>`;h+=`<div class="grid-header" style="grid-template-columns:1fr 36px 26px 36px 52px"><div>PLAYER</div><div style="text-align:center">R</div><div style="text-align:center">W</div><div style="text-align:center">F</div><div style="text-align:right">PTS</div></div>`;sqPl.forEach((p,i)=>{h+=`<div class="ri grid-row" style="grid-template-columns:1fr 36px 26px 36px 52px;animation-delay:${i*.03}s"><div><div style="display:flex;align-items:center;gap:3px"><span style="font-size:9px">${re(p.rl)}</span><span style="font-weight:700;font-size:11px;color:${p.pt>0?"#1a1a2e":"#ccc"}">${esc(p.n)}</span></div><div style="font-size:8px;color:#bbb;margin-left:16px">${tb(p.t)}</div></div><div style="text-align:center;color:${p.r>0?"#1a1a2e":"#ddd"};font-weight:700;font-size:10px">${p.r||"-"}</div><div style="text-align:center;color:${p.w>0?"#22c55e":"#ddd"};font-weight:700;font-size:10px">${p.w||"-"}</div><div style="text-align:center;color:${(p.c+p.ro)>0?"#6c3ce0":"#ddd"};font-weight:700;font-size:10px">${(p.c+p.ro)||"-"}</div><div style="text-align:right;font-weight:900;font-size:12px;color:${p.pt>0?tc.c:"#ddd"}">${p.pt||"0"}</div></div>`});h+=`</div>`}

  if(st.tab==="highlights"){if(MA.length===0){h+=`<div class="cd" style="text-align:center;padding:30px"><div style="font-size:28px;margin-bottom:8px">📭</div><div style="font-size:14px;font-weight:800;color:#6c3ce0">No matches played yet</div></div>`} else {if(st.selM>=MA.length)st.selM=MA.length-1;const match=MA[st.selM];h+=`<div class="cd" style="padding:14px 16px"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div onclick="if(st.selM>0){st.selM--;render()}" class="nav-btn ${st.selM>0?"nav-btn-on":"nav-btn-off"}"><span style="color:${st.selM>0?"#6c3ce0":"#ddd"};font-size:18px;font-weight:900">‹</span></div><div style="text-align:center;flex:1"><div style="font-size:9px;color:#a855f7;font-weight:800;letter-spacing:2px;margin-bottom:4px">🎯 MATCH HIGHLIGHTS</div><div style="font-size:18px;font-weight:900">${tb(match.t1)} <span style="color:#ccc;font-size:11px;margin:0 3px">vs</span> ${tb(match.t2)}</div><div style="font-size:10px;color:#9ca3af;margin-top:4px;font-weight:600">Match ${st.selM+1} of ${MA.length} · ${match.dt}</div></div><div onclick="if(st.selM<${MA.length-1}){st.selM++;render()}" class="nav-btn ${st.selM<MA.length-1?"nav-btn-on":"nav-btn-off"}"><span style="color:${st.selM<MA.length-1?"#6c3ce0":"#ddd"};font-size:18px;font-weight:900">›</span></div></div></div>`;h+=`<div class="cd" style="text-align:center;padding:10px 14px;background:#ecfdf5"><div style="font-size:12px;font-weight:800;color:#16a34a">✅ ${match.rs}</div></div>`;const mgrPts={};Object.entries(R).forEach(([p,i])=>{let r=match.b?.[p]||0,w=match.w?.[p]||0,c=match.ct?.[p]||0,ro=match.ro?.[p]||0;if(r>0||w>0||c>0||ro>0){let pt=r*P.r+w*P.w+c*P.c+ro*P.ro;if(!mgrPts[i.m])mgrPts[i.m]={tot:0,pls:[]};mgrPts[i.m].tot+=pt;mgrPts[i.m].pls.push({n:p,r,w,c,ro,pt,t:i.t,rl:i.r})}});const mgrSorted=Object.entries(mgrPts).sort((a,b)=>b[1].tot-a[1].tot);mgrSorted.forEach(([mgr,data],mi)=>{const mc=M[mgr];h+=`<div class="cd ri" style="animation-delay:${mi*.06}s;border-color:${mi===0?mc.c+"30":"transparent"};background:${mi===0?mc.bg:"rgba(255,255,255,.88)"}"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><div style="display:flex;align-items:center;gap:10px"><div style="width:32px;height:32px;border-radius:10px;background:${mc.g};display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:800;flex-shrink:0">${mi===0?"🏆":mi+1}</div><div><div style="font-size:13px;font-weight:800">${mc.e} ${mgr}</div><div style="font-size:9px;color:#9ca3af;font-weight:600">${mc.tag} · ${data.pls.length} scorers</div></div></div><div style="font-size:24px;font-weight:900;color:${mc.c}">${data.tot}<span style="font-size:8px;color:#9ca3af;margin-left:2px">PTS</span></div></div>`;data.pls.sort((a,b)=>b.pt-a.pt).forEach((p,j)=>{h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid #f8f8fc"><div style="display:flex;align-items:center;gap:6px"><span style="font-size:9px">${re(p.rl)}</span><span style="font-weight:700;font-size:11px">${esc(p.n)}</span><span style="font-size:8px;color:#bbb">${tb(p.t)}</span></div><div style="font-weight:800;color:${mc.c};font-size:11px">${pb(p)} = ${p.pt}</div></div>`});h+=`</div>`})}}

  if(st.tab==="players"){h+=`<div class="cd">`;tp.forEach((p,i)=>{const mc=M[p.mg];h+=`<div class="ri" style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;${i<tp.length-1?"border-bottom:1px solid #f8f8fc":""};animation-delay:${i*.03}s"><div style="display:flex;align-items:center;gap:10px"><span style="font-weight:900;font-size:14px;width:26px;text-align:center;color:${i<3?"#6c3ce0":"#ccc"}">${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</span><div><div style="font-size:12px;font-weight:700">${re(p.rl)} ${esc(p.n)}</div><div style="font-size:9px;color:#9ca3af;margin-top:1px;font-weight:600">${tb(p.t)} · <span style="color:${mc?.c}">${mc?.e} ${p.mg.split(" ")[0]}</span></div></div></div><div style="text-align:right"><div style="font-weight:900;font-size:18px;color:${mc?.c}">${p.pt}</div><div style="font-size:8px;color:#bbb;font-weight:600">${pb(p)}</div></div></div>`});h+=`</div>`}

  if(st.tab==="next"){const upcoming=getUpcoming();if(upcoming.length===0){h+=`<div class="cd" style="text-align:center;padding:30px"><div style="font-size:28px;margin-bottom:8px">🏆</div><div style="font-size:14px;font-weight:800;color:#6c3ce0">All matches completed!</div></div>`} else {const grouped=groupByDate(upcoming);const dates=Object.keys(grouped);if(st.prevDay>=dates.length)st.prevDay=dates.length-1;const dt=dates[st.prevDay],dayMatches=grouped[dt],isDH=dayMatches.length>1;h+=`<div class="preview-grid"><div><div class="cd" style="padding:16px 18px"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div onclick="if(st.prevDay>0){st.prevDay--;render()}" class="nav-btn ${st.prevDay>0?"nav-btn-on":"nav-btn-off"}"><span style="color:${st.prevDay>0?"#6c3ce0":"#ddd"};font-size:18px;font-weight:900">‹</span></div><div style="text-align:center"><div style="font-size:9px;color:#a855f7;font-weight:800;letter-spacing:2px;margin-bottom:4px">🔮 MATCH DAY PREVIEW</div><div style="font-size:18px;font-weight:900">${dt}</div><div style="font-size:10px;color:#9ca3af;margin-top:3px;font-weight:600">${isDH?"🔥 Double Header":"Single Match"} · Day ${st.prevDay+1} of ${dates.length}</div></div><div onclick="if(st.prevDay<${dates.length-1}){st.prevDay++;render()}" class="nav-btn ${st.prevDay<dates.length-1?"nav-btn-on":"nav-btn-off"}"><span style="color:${st.prevDay<dates.length-1?"#6c3ce0":"#ddd"};font-size:18px;font-weight:900">›</span></div></div></div>${isDH?`<div class="dh">🔥 DOUBLE HEADER · ${dt}</div>`:''}${dayMatches.map((m,mi)=>`<div class="cd ri" style="animation-delay:${mi*.06}s;${isDH?"border-left:3px solid #ec4899;":""}"><div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap"><div><div style="font-size:16px;font-weight:900">${tb(m.t1)} <span style="color:#ccc;font-size:11px;margin:0 4px">vs</span> ${tb(m.t2)}</div><div style="font-size:10px;color:#9ca3af;margin-top:4px;font-weight:600">Match #${m.n} · ${m.v}</div></div><span class="badge" style="background:#eef6ff;color:#2d7dd2;font-size:9px">Upcoming</span></div></div>`).join('')}</div><div><div class="cd"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px"><div style="font-size:17px;font-weight:900;letter-spacing:-.02em">Fantasy Players In Action</div><div style="font-size:11px;color:#8b5cf6;font-weight:800;letter-spacing:.14em;text-transform:uppercase">Preview</div></div>${Object.entries(M).map(([mgr,mc])=>{const pls=[];dayMatches.forEach(m=>{Object.entries(R).forEach(([n,i])=>{if(i.m===mgr&&(i.t===m.t1||i.t===m.t2))pls.push({n,r:i.r,t:i.t})})});if(!pls.length)return '';return `<div style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="font-size:11px">${mc.e}</span><span style="font-weight:800;font-size:11px;color:${mc.c}">${mgr}</span><span style="font-size:9px;color:#9ca3af;font-weight:700">${mc.tag} · ${pls.length} in action</span></div>${pls.map((p,pi)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:${pi<pls.length-1?"1px solid #f8f8fc":"none"}"><div style="display:flex;align-items:center;gap:5px"><span style="font-size:9px">${re(p.r)}</span><span style="font-weight:600;font-size:11px">${esc(p.n)}</span></div><span style="color:${TC[p.t]};font-weight:700;font-size:9px">${p.t}</span></div>`).join('')}</div>`}).join('')}</div></div></div>`}}

  if(st.tab==="table"){h+=`<div class="cd"><div style="font-size:16px;font-weight:800;color:#1a1a2e;margin-bottom:12px">📊 IPL 2026 Standings</div>`;h+=`<div class="grid-header" style="grid-template-columns:24px 1fr 28px 28px 28px 50px 36px"><div>#</div><div>TEAM</div><div style="text-align:center">M</div><div style="text-align:center">W</div><div style="text-align:center">L</div><div style="text-align:right">NRR</div><div style="text-align:right">PTS</div></div>`;PT.forEach((t,i)=>{h+=`<div class="ri grid-row" style="grid-template-columns:24px 1fr 28px 28px 28px 50px 36px;animation-delay:${i*.03}s;${i<4?"background:#f8f8fc;border-radius:8px;margin:2px 0":""}"><div style="font-weight:800;font-size:11px;color:${i<4?"#6c3ce0":"#ccc"}">${i+1}</div><div style="font-weight:800;font-size:12px;color:${TC[t.t]}">${t.t}</div><div style="text-align:center;color:#888;font-weight:700;font-size:10px">${t.m}</div><div style="text-align:center;color:#22c55e;font-weight:700;font-size:10px">${t.w||"-"}</div><div style="text-align:center;color:${t.l>0?"#ef4444":"#eee"};font-weight:700;font-size:10px">${t.l||"-"}</div><div style="text-align:right;color:${parseFloat(t.nrr)>0?"#22c55e":parseFloat(t.nrr)<0?"#ef4444":"#999"};font-weight:700;font-size:9px">${t.nrr}</div><div style="text-align:right;font-weight:900;font-size:13px;color:${t.pts>0?"#6c3ce0":"#ddd"}">${t.pts}</div></div>`});h+=`<div style="margin-top:10px;padding-top:8px;border-top:1.5px solid #f0f2f8;font-size:9px;color:#bbb;font-weight:600">Top 4 qualify for playoffs · 2pts per win</div></div>`}

  if(st.tab==="schedule"){h+=`<div style="font-size:16px;font-weight:800;color:#1a1a2e;margin-bottom:12px">📅 IPL 2026 Schedule</div>`;let prevDt="";SCH.forEach((s,i)=>{if(s.dh&&s.dt!==prevDt){h+=`<div class="dh">🔥 DOUBLE HEADER · ${s.dt}</div>`}prevDt=s.dt;h+=`<div class="cd ri" style="padding:10px 14px;animation-delay:${i*.02}s;${s.done?"opacity:.5":""}"><div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap"><div><div style="font-size:12px;font-weight:800">${tb(s.t1)} <span style="color:#ccc;font-size:9px">vs</span> ${tb(s.t2)}</div><div style="font-size:9px;color:#bbb;margin-top:3px;font-weight:600">#${s.n} · ${s.dt} · ${s.v}</div></div><div>${s.done?`<span class="badge" style="background:#ecfdf5;color:#16a34a">✓ Done</span>`:`<span class="badge" style="background:#eef6ff;color:#2d7dd2">Upcoming</span>`}</div></div></div>`})}

  h+=`<div style="text-align:center;margin-top:16px;padding:12px 0"><div style="font-size:9px;color:#bbb;font-weight:700;letter-spacing:1.5px">FANTASY IPL 2026 · RESPONSIVE PREVIEW · 5 MANAGERS · 75 PLAYERS · ${MA.length} MATCHES</div></div>`;
  document.getElementById("app").innerHTML=h;
  let nav=document.getElementById("bnav");if(!nav){nav=document.createElement("div");nav.id="bnav";nav.className="bnav";document.body.appendChild(nav)}nav.innerHTML=NAVTABS.map(([k,ic,label])=>`<div class="bnav-item ${st.tab===k?"on":""}" onclick="st.tab='${k}';render()"><span class="bi">${ic}</span>${label}</div>`).join("")}
render();
</script>
